name: Production UZSE connection diagnostics

on:
  workflow_dispatch:
  push:
    branches: [API]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose-uzse]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect the active services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /root/uzstock/app
          git rev-parse HEAD
          docker inspect --format '{{.Config.Image}} {{.State.Status}}' uzstock-web
          systemctl show uzstock-quotes-2130.service -p ActiveState -p Result -p ExecMainStatus
          systemctl list-timers 'uzstock-quotes-*' --no-pager
          REMOTE
      - name: Compare production container and host source access
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          echo 'Production container: configured route, direct route, and canonical hostname'
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            'docker exec -i uzstock-web python -' < scripts/diagnose_uzse.py
          echo 'Production host: compare against container networking'
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            'python3 -' < scripts/diagnose_uzse.py
      - name: Compare a separate network
        run: python3 scripts/diagnose_uzse.py
