name: Temporary public routing investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/API'
    environment: uzstock-production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect production routing without changing services
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          python3 - <<'PY'
          import concurrent.futures, importlib.util, json, re, shutil, socket, struct, subprocess, threading, time, urllib.request
          from collections import Counter
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("ci_log", "scripts/ci_log.py")
          log = importlib.util.module_from_spec(spec); spec.loader.exec_module(log)
          def show(name, text):
              print("\nCHECK " + name + "\n" + log.redact(text), flush=True)
          def cmd(name, args):
              p = subprocess.run(args, text=True, capture_output=True, timeout=15)
              show(name, p.stdout+p.stderr)
          addresses=json.loads(subprocess.check_output(["ip","-j","addr","show","dev","eth0"],text=True))
          local=next(a["local"] for item in addresses for a in item["addr_info"] if a["family"]=="inet")
          cmd("neighbors",["ip","neigh"])
          cmd("routing back to the observed edge",["ip","route","get","192.168.77.201"])
          cmd("gateway reachability",["ping","-c","2","-W","2","192.168.77.201"])
          cmd("reverse path filtering",["sysctl","net.ipv4.conf.all.rp_filter","net.ipv4.conf.eth0.rp_filter"])
          cmd("packet counters",["ip","-s","link","show","eth0"])
          print("CAPTURE_READY: 35 seconds, TCP headers only, excluding SSH; no payload is stored",flush=True)
          counts=Counter()
          def capture():
              s=socket.socket(socket.AF_PACKET,socket.SOCK_RAW,socket.htons(0x0800)); s.bind(("eth0",0)); s.settimeout(1)
              end=time.monotonic()+35
              try:
                  while time.monotonic()<end:
                      try: p=s.recv(96)
                      except socket.timeout: continue
                      if len(p)<54 or p[12:14]!=b'\x08\x00' or p[23]!=6: continue
                      ihl=(p[14]&15)*4; off=14+ihl
                      if len(p)<off+14: continue
                      src=socket.inet_ntoa(p[26:30]); dst=socket.inet_ntoa(p[30:34]); sport,dport=struct.unpack("!HH",p[off:off+4]); flags=p[off+13]
                      if dst==local and dport!=22 and flags&2:
                          counts[("incoming SYN",src,dport)] += 1
                      if src==local and sport in (80,443,8001):
                          counts[("origin reply",dst,sport,flags)] += 1
              finally: s.close()
              show("TCP observations",json.dumps([(str(k),v) for k,v in counts.items()]))
          def probes():
              time.sleep(2)
              for label,url in [("private interface HTTP","http://"+local+"/health"),("public health","https://uzstock.uz/health")]:
                  t=time.monotonic()
                  try:
                      req=urllib.request.Request(url,headers={"Host":"uzstock.uz"})
                      with urllib.request.urlopen(req,timeout=12) as r: result=f"status={r.status}"
                  except Exception as e: result=type(e).__name__
                  show(label,result+" seconds="+str(round(time.monotonic()-t,3)))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              list(pool.map(lambda f:f(),[capture,probes]))
          for p in Path("/var/log/nginx").glob("*access.log"):
              result=subprocess.run(["tail","-n","10000",str(p)],text=True,capture_output=True,timeout=10)
              hourly=Counter(); last=[]
              for line in result.stdout.splitlines():
                  m=re.match(r'(\S+).*?\[([^]]+)\] "[^"]*" (\d+)',line)
                  if m:
                      peer,stamp,status=m.groups(); hourly[(stamp[:14],status)]+=1; last.append((peer,stamp,status))
              show("access activity "+p.name,json.dumps({"hours":list(hourly.items())[-30:],"last_15":last[-15:]}))
          PY
          REMOTE
