name: Production UZSE connection diagnostics

on:
  workflow_dispatch:
  push:
    branches: [API]

permissions:
  contents: read

jobs:
  diagnose:
    # Production secrets live in this environment, which only the API
    # branch may use: a pushed branch editing this file cannot reach them.
    environment: uzstock-production
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose-uzse]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect the active services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /root/uzstock/app
          git rev-parse HEAD
          docker inspect --format '{{.Config.Image}} {{.State.Status}}' uzstock-web
          systemctl show uzstock-quotes-catchup.service -p ActiveState -p Result -p ExecMainStatus
          systemctl list-timers 'uzstock-quotes-*' --no-pager
          REMOTE
      - name: Inspect collector monitor failures
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          {
            systemctl show uzstock-collection-monitor.service uzstock-collection-monitor.timer \
              -p ActiveState -p SubState -p Result -p ExecMainStatus -p WorkingDirectory \
              -p LastTriggerUSec -p NextElapseUSecMonotonic
            journalctl -u uzstock-collection-monitor.service -n 100 --no-pager -o cat
            journalctl --no-pager -n 80 -o cat _SYSTEMD_UNIT=uzstock-bank-fx.service + UNIT=uzstock-bank-fx.service + SYSLOG_IDENTIFIER=uzstock-bank-fx
            docker exec uzstock-web python -c 'import json; from collection_ops import store; d=store.overview(); j=next(j for j in d["items"] if j["id"]=="bank-fx"); print(json.dumps({"observer":d["observer"], "bank_fx":j["latest"], "requests":j["requests"][:1]}))'
            python3 - <<'PY'
          import subprocess
          from collection_ops import host
          from collection_ops.registry import JOBS
          try:
              entries = host.journal(JOBS["bank-fx"], host.properties("uzstock-bank-fx.service"))
              print("Bank FX journal entries:", len(entries))
          except subprocess.CalledProcessError as exc:
              print("Bank FX journal read failed:", exc.stderr)
          PY
          } 2>&1 | python3 scripts/ci_log.py collection-monitor-diagnostic 140
          REMOTE
      - name: Compare production container and host source access
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          echo 'Production container: configured route, direct route, and canonical hostname'
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            'docker exec -i uzstock-web python -' < scripts/diagnose_uzse.py
          echo 'Production host: compare against container networking'
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            'python3 -' < scripts/diagnose_uzse.py
      - name: Compare a separate network
        run: python3 scripts/diagnose_uzse.py
