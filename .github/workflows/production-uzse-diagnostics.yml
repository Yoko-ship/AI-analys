name: Temporary server panel inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/API'
    environment: uzstock-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read local panel services, listeners, and web health
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          python3 - <<'PY'
          import concurrent.futures, importlib.util, json, re, subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("ci_log","scripts/ci_log.py")
          log=importlib.util.module_from_spec(spec); spec.loader.exec_module(log)
          pattern=re.compile(r"webmin|usermin|virtualmin|cockpit|hestia|vesta|cpanel|cpserv|plesk|psa|sw-cp|directadmin|cyberpanel|lscpd|litespeed|bt-panel|aapanel|ispmanager|ispmgr|mgr5|ispsystem|ajenti|cloudpanel|fastpanel|vestacp|portainer|nginx-proxy|openresty|pveproxy|pvedaemon|proxmox|coolify|dokploy|caprover",re.I)
          def call(args,timeout=20):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
                  return p.returncode,p.stdout+p.stderr
              except Exception as e:return -1,type(e).__name__
          def show(label,value):
              text=value if isinstance(value,str) else json.dumps(value)
              print("\nCHECK "+label+"\n"+log.redact(text[-18000:]),flush=True)
          show("time",call(["date","-Is"])[1])
          show("virtualization",call(["systemd-detect-virt"])[1])
          show("checkout",call(["git","rev-parse","HEAD"])[1])
          show("container inventory",call(["docker","ps","-a","--format","{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}"])[1])
          show("host TCP listeners",call(["ss","-ltnp"])[1])
          dirs=[
          "/usr/local/hestia","/usr/local/vesta","/usr/local/cpanel","/etc/cpanel",
          "/usr/local/psa","/opt/psa","/etc/psa","/usr/local/directadmin",
          "/etc/webmin","/usr/share/webmin","/etc/cockpit","/usr/share/cockpit",
          "/usr/local/CyberCP","/usr/local/lscp","/www/server/panel","/www/server/bt-panel",
          "/usr/local/mgr5","/opt/ispsystem","/etc/ajenti","/etc/cloudpanel",
          "/usr/local/fastpanel2","/etc/pve","/data/coolify","/etc/dokploy",
          "/data/nginx/proxy_host","/opt/nginx-proxy-manager"
          ]
          show("known panel installation directories",[p for p in dirs if Path(p).exists()])
          _,packages=call(["dpkg-query","-W","-f=${binary:Package}\t${Version}\n"])
          show("panel packages",[l for l in packages.splitlines() if pattern.search(l)])
          _,processes=call(["ps","-eo","comm="])
          show("panel processes",sorted({l.strip() for l in processes.splitlines() if pattern.search(l)}))
          _,units=call(["systemctl","list-units","--all","--type=service","--plain","--no-legend","--no-pager"])
          show("panel and web services",[l for l in units.splitlines() if pattern.search(l) or re.search(r"\b(nginx|apache2|httpd|haproxy|caddy|traefik|snap.docker.dockerd)\.service",l)])
          _,files=call(["systemctl","list-unit-files","--type=service","--no-legend","--no-pager"])
          show("installed panel service units",[l for l in files.splitlines() if pattern.search(l)])
          for line in units.splitlines():
              fields=line.split()
              if fields and pattern.search(fields[0]):
                  name=fields[0]
                  show("panel unit "+name,call(["systemctl","show",name,"-p","ActiveState","-p","SubState","-p","Result","-p","FragmentPath"])[1])
                  show("recent panel errors "+name,call(["journalctl","-u",name,"-p","warning","-n","15","--no-pager"])[1])
          _,nginx=call(["nginx","-T"])
          show("configured local web endpoints","\n".join(l for l in nginx.splitlines() if re.match(r"\s*(# configuration file|listen |server_name |proxy_pass |upstream )",l)))
          show("nginx syntax",call(["nginx","-t"])[1])
          def probe(item):
              label,args=item
              show(label,call(args,timeout=15)[1])
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              list(pool.map(probe,[
                  ("internal website",["curl","-fsS","--max-time","10","-H","Host: uzstock.uz","-o","/dev/null","-w","HTTP=%{http_code} seconds=%{time_total}\n","http://127.0.0.1/health"]),
                  ("public website",["curl","-fsS","--max-time","10","-o","/dev/null","-w","HTTP=%{http_code} seconds=%{time_total}\n","https://uzstock.uz/health"])
              ]))
          PY
          REMOTE
