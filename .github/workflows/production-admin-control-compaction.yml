name: Production admin-control compaction

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter COMPACT to compact history, or CLEANUP to remove only failed temporary output"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compact:
    if: inputs.confirm == 'COMPACT' || inputs.confirm == 'CLEANUP'
    name: Compact the bounded admin-control revision history
    runs-on: ubuntu-latest
    # A 64-GB source can take longer than 35 minutes to stream on the VPS;
    # replacement is atomic and writers are stopped, so allow the bounded copy
    # to complete rather than cancelling it mid-scan.
    timeout-minutes: 120
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compact only stale revisions, then restore the web service
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          db_path=/app/data/admin_control.sqlite3
          docker inspect uzstock-web >/dev/null
          docker volume inspect uzstock_data >/dev/null
          image=$(docker inspect --format '{{.Config.Image}}' uzstock-web)
          was_running=$(docker inspect --format '{{.State.Running}}' uzstock-web)
          restore_web() {
            if [ "$was_running" = true ] && [ "$(docker inspect --format '{{.State.Running}}' uzstock-web)" != true ]; then
              docker start uzstock-web >/dev/null || true
            fi
          }
          trap restore_web EXIT

          echo '== Before compaction =='
          df -h /
          # A previous interrupted atomic replacement can leave one of these
          # exact, non-live copies beside the source. The source must exist and
          # open read-only first; only then may the user-approved stale copy be
          # removed. This is the room the next replacement needs.
          docker run --rm --network none --entrypoint python \
            -v uzstock_data:/app/data "$image" - <<'PY'
          from pathlib import Path
          import sqlite3

          source = Path('/app/data/admin_control.sqlite3')
          if not source.is_file():
              raise SystemExit('Live admin-control database is missing; refusing stale-copy cleanup.')
          conn = sqlite3.connect(f'{source.as_uri()}?mode=ro', uri=True)
          try:
              assert conn.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='control_revisions'").fetchone()
          finally:
              conn.close()
          for suffix in ('.compacting', '.precompact'):
              stale = Path(f'{source}{suffix}')
              if stale.exists():
                  if not stale.is_file():
                      raise SystemExit(f'Refusing non-file stale target: {stale}')
                  print(f'removing_stale_copy={stale} bytes={stale.stat().st_size}')
                  stale.unlink()
          PY
          if [ "${{ inputs.confirm }}" = 'CLEANUP' ]; then
            docker builder prune --all --force
            docker image prune --all --force
            docker restart uzstock-web >/dev/null
            df -h /
            exit 0
          fi
          # The database replacement needs temporary room. These remove only
          # rebuildable build cache and unreferenced image layers; named volumes
          # (including PostgreSQL and application data) are never pruned.
          docker builder prune --all --force
          docker image prune --all --force
          free_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          # The replacement contains only retained revisions, not a second
          # 64-GB source. 512 MiB is enough for its bounded target while still
          # leaving an explicit guard against a zero-free-space write.
          if [ "${free_kb:-0}" -lt 524288 ]; then
            echo 'Less than 512 MiB remains after safe Docker cleanup; refusing compaction.' >&2
            exit 1
          fi
          # The web process may already be down precisely because the volume is
          # full or has root ownership. Read the database from an isolated
          # helper instead of requiring `docker exec` against a running app.
          docker run --rm --network none --entrypoint python \
            -v uzstock_data:/app/data "$image" - <<'PY'
          import os, sqlite3
          path = os.environ.get("ADMIN_CONTROL_DB", "/app/data/admin_control.sqlite3")
          conn = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          try:
              page_count = conn.execute("PRAGMA page_count").fetchone()[0]
              page_size = conn.execute("PRAGMA page_size").fetchone()[0]
              revisions = conn.execute("SELECT COUNT(*) FROM control_revisions").fetchone()[0]
              print(f"ADMIN_DB_BYTES={page_count * page_size} revisions={revisions}")
          finally:
              conn.close()
          PY

          # The service must not write while the replacement is assembled and
          # atomically swapped. PostgreSQL and every other named volume remain
          # running and untouched.
          if [ "$was_running" = true ]; then
            docker stop -t 30 uzstock-web >/dev/null
          fi
          docker run --rm --network none --entrypoint python \
            -v uzstock_data:/app/data "$image" \
            /app/scripts/compact_admin_control.py --database "$db_path" --keep 10 --days 90 --discard-stale-target --confirm

          # The compactor deliberately runs as root to preserve and swap the
          # SQLite file. Restore the application account and prove it can write
          # before asking Docker to start the web process again.
          docker run --rm --network none --user root --entrypoint sh \
            -v uzstock_data:/app/data "$image" -c '
              set -eu
              mkdir -p /app/data
              chown -R appuser:appuser /app/data
              gosu appuser sh -c "probe=/app/data/.uzstock-write-test; : > \"$probe\"; rm -f \"$probe\""
            '

          restore_web
          trap - EXIT
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' uzstock-web)" = true; then
              break
            fi
            sleep 2
          done
          if [ "$(docker inspect --format '{{.State.Running}}' uzstock-web)" != true ]; then
            docker logs --tail 120 uzstock-web >&2 || true
            exit 1
          fi

          echo '== After compaction =='
          docker exec -i uzstock-web python - <<'PY'
          import os, sqlite3
          import psycopg
          path = os.environ.get("ADMIN_CONTROL_DB", "/app/data/admin_control.sqlite3")
          conn = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          try:
              assert conn.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              page_count = conn.execute("PRAGMA page_count").fetchone()[0]
              page_size = conn.execute("PRAGMA page_size").fetchone()[0]
              revisions = conn.execute("SELECT COUNT(*) FROM control_revisions").fetchone()[0]
              print(f"ADMIN_DB_BYTES={page_count * page_size} revisions={revisions}")
          finally:
              conn.close()
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=10) as pg:
              with pg.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM web_users")
                  print(f"AUTH_DB_STATUS=ok user_count={cur.fetchone()[0]}")
          PY
          df -h /
          REMOTE
