name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_market_now:
        description: Run one market refresh on production after deployment
        required: false
        type: boolean
        default: false
      run_news_now:
        description: Run the production Claude news collector after deployment
        required: false
        type: boolean
        default: false
      report_news_usage:
        description: Print the latest production news-collector usage record without running Claude
        required: false
        type: boolean
        default: false
      backfill_financial_ticker:
        description: Parse and publish one issuer's historical annual financials (for example UZTL)
        required: false
        type: string
        default: ""
      backfill_quarter_history_ticker:
        description: Recover one issuer's quarterly filings older than OpenInfo's ten-report window (for example YGSY)
        required: false
        type: string
        default: ""
      backfill_column_sources:
        description: Populate recent NSBU source tables for all catalogued issuers
        required: false
        type: boolean
        default: false

# Finish an active release instead of cancelling it during a container swap.
# GitHub retains only the newest pending run for this branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Secret scan. The repository is public: a committed key is exposed the moment
  # it is pushed, so every change is scanned and a finding blocks deployment.
  # Known false positives are listed in .gitleaksignore.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the working tree and the pushed commits for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          BEFORE: ${{ github.event.before }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir --redact --no-banner .
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            ./gitleaks git --redact --no-banner --log-opts="$BEFORE..HEAD" .
          fi

  release-plan:
    name: Compare with the running production release
    needs: secret-scan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/API'
    environment: uzstock-production
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Read the revision of the running image
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' uzstock-web" \
            > "$RUNNER_TEMP/running-revision"
      - name: Decide whether production needs this commit
        id: plan
        env:
          EXPECTED_SHA: ${{ github.sha }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[') }}
        run: |
          options=()
          if [ "$FORCE_RELEASE" = true ]; then options+=(--force); fi
          python scripts/release_plan.py --running "$(cat "$RUNNER_TEMP/running-revision")" \
            --head "$EXPECTED_SHA" --output "$GITHUB_OUTPUT" "${options[@]}"

  # ---------------------------------------------------------------------------
  # Backend. The previous version of this job compiled 11 of ~30 modules and ran
  # zero tests, so the numeric transforms in reports_catalog / analysis_service —
  # exactly where the 1000x parse bug, the sign bugs and the period mislabel lived
  # — were never exercised by anything.
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-local-test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt -r requirements-dev.txt

      - name: Compile every module
        # Not a hand-maintained list: a new module must not be able to join the
        # repo already broken because nobody added it here.
        run: python -m compileall -q .

      - name: Audit server dependencies for known vulnerabilities
        # Nothing used to look: requests, lxml and python-dotenv sat on versions
        # with published advisories until a manual audit on 2026-10-15. A new
        # advisory now fails the build; bump the pin, or for one with no fix yet,
        # add --ignore-vuln <ID> here with the reason.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-server.txt --progress-spinner off

      - name: Verify the server image declares every import it uses
        # The failure this catches: feedparser and pdfplumber were imported by
        # collector code but absent from requirements-server.txt, so the Railway
        # cron jobs exited 0 having silently collected nothing for weeks.
        run: python scripts/check_server_requirements.py

      # Includes reporting regressions and bank ingestion safety tests; run each
      # case once per Python version instead of repeating subsets around it.
      - name: Required full backend suite and architecture boundaries
        env:
          TEST_POSTGRES_URL: postgresql://qa:qa-local-test@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgresql://qa:qa-local-test@127.0.0.1:5432/postgres
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_BACKEND: sqlite
          DATABASE_URL: ""
          DATABASE_PUBLIC_URL: ""
          APP_DATA_DIR: ${{ runner.temp }}/uzstock-full-tests
          CATALOG_WATCH: "0"
          NEWS_CALENDAR_WATCH: "0"
          SECTOR_ANALYSIS_WORKER: "0"
          ADMIN_CONTROL_WORKER: "0"
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------------
  # Frontend. Lint is load-bearing here, not cosmetic: react-hooks/rules-of-hooks
  # is the only mechanical guard against the CompareTable class of crash (a hook
  # after an early return) in a 10k-line, ~60-component file.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit shipped npm dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (Rules of Hooks is an error)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Run feature-specific browser tests during implementation (see AGENTS.md).
      # Push/PR CI stops at the build; targeted live smoke checks follow deployment.

  # ---------------------------------------------------------------------------
  # The image both cron collectors and the API actually run.
  # ---------------------------------------------------------------------------
  docker:
    needs: [secret-scan, release-plan]
    if: ${{ !cancelled() && !failure() && (github.ref != 'refs/heads/API' || needs.release-plan.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the image for this commit
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image once with persistent layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            uz-stock-bot
            ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=uzstock-runtime
          cache-to: type=gha,scope=uzstock-runtime,mode=max
      - name: Smoke-check the runtime dependencies inside the image
        # Import every package the collectors need, in the built image — the only
        # place that answers "will tonight's cron actually work".
        run: |
          docker run --rm --entrypoint python uz-stock-bot -c "
          import importlib, sys
          import scripts.publish_reviewed_bank_ifrs
          from runtime_preflight import COLLECTOR_REQUIREMENTS, NEWS_REQUIREMENTS
          missing = [n for n in {**COLLECTOR_REQUIREMENTS, **NEWS_REQUIREMENTS}
                     if importlib.util.find_spec(n) is None]
          print('checked', len({**COLLECTOR_REQUIREMENTS, **NEWS_REQUIREMENTS}), 'packages')
          if missing:
              sys.exit('MISSING in the server image: ' + ', '.join(missing))
          print('all collector dependencies present')
          "
      - name: Run the nginx edge configuration in a real nginx
        # The deploy writes this into the live nginx; prove here that nginx
        # accepts it and that it limits per visitor, not per proxy. Requests
        # from this runner reach the container from the Docker gateway, a
        # trusted private address, exactly as the provider's proxy reaches the VPS.
        run: |
          edge="$RUNNER_TEMP/edge"
          mkdir -p "$edge/conf.d" "$edge/snippets"
          PROBE_TOKEN=citoken python3 scripts/nginx_edge.py render "$edge/conf.d"
          mv "$edge/conf.d/uzstock-monitor.conf" "$edge/snippets/"
          # The site location serves a file, as production proxies: a `return`
          # answers in the rewrite phase, before limit_req ever runs.
          printf 'server {\n    listen 8080;\n    include /etc/nginx/snippets/uzstock-monitor.conf;\n    location / { root /usr/share/nginx/html; try_files /index.html =404; }\n}\n' > "$edge/conf.d/site.conf"
          docker run -d --name edge -p 127.0.0.1:8080:8080 -p 127.0.0.1:8081:80 \
            -v "$edge/conf.d:/etc/nginx/conf.d:ro" -v "$edge/snippets:/etc/nginx/snippets:ro" nginx:1.24.0
          for attempt in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          docker logs edge
          # The public proxy forwards www to this HTTP origin. Preserve the
          # full URL while consolidating it onto the primary HTTPS domain.
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: www.uzstock.uz' 'http://127.0.0.1:8081/company/UZTL?report=ai&source=search')" = '301 https://uzstock.uz/company/UZTL?report=ai&source=search' ] \
            || { echo "www canonical redirect lost its status, path or query"; exit 1; }
          probe="$(curl -fsS -H 'X-UZStock-Edge-Probe: citoken' -H 'X-Forwarded-For: 203.0.113.9' http://127.0.0.1:8080/__uzstock/edge-probe)"
          echo "probe answered: $probe"
          [ "$(echo "$probe" | awk '{print $2}')" = "203.0.113.9" ] || { echo "realip did not resolve the visitor"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/__uzstock/edge-probe)" = "404" ] || { echo "the probe answers without its token"; exit 1; }
          # 700 requests at once against a burst of 400: a fresh bucket admits
          # at least 400, a spent one only what refills while they run.
          admitted() { curl -s -o /dev/null -w '%{http_code}\n' -H "X-Forwarded-For: $1" $(seq -f 'http://127.0.0.1:8080/?%g' 1 700) | grep -c '^200$' || true; }
          first="$(admitted 203.0.113.9)"; echo "one visitor, 700 at once: $first admitted"
          [ "$first" -ge 400 ] && [ "$first" -lt 700 ] || { echo "a flood from one visitor was not limited at the burst"; exit 1; }
          spoofed="$(admitted '1.2.3.4, 203.0.113.9')"; echo "same visitor, forged left-hand entry: $spoofed admitted"
          [ "$spoofed" -lt 200 ] || { echo "a forged X-Forwarded-For entry bought a fresh bucket"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 198.51.100.7' http://127.0.0.1:8080/)" = "200" ] \
            || { echo "a second visitor was limited by the first one's flood"; exit 1; }
          docker rm -f edge
      - name: Back up off-site and restore, end to end
        # scripts/offsite_backup.sh against a local target instead of a bucket:
        # only ciphertext may land there, and the password must bring back the
        # dumps, the documents and a working copy of a live SQLite database.
        run: |
          work="$RUNNER_TEMP/offsite"
          mkdir -p "$work/pg" "$work/bucket" "$work/restore"
          docker volume create offsite-test-data >/dev/null
          docker run --rm --user root -v offsite-test-data:/app/data --entrypoint python uz-stock-bot -c "
          import os, sqlite3
          db = sqlite3.connect('/app/data/admin_control.sqlite3')
          db.execute('PRAGMA journal_mode=WAL'); db.execute('CREATE TABLE t (x)'); db.execute(\"INSERT INTO t VALUES ('plain-marker-7c1')\"); db.commit()
          os.makedirs('/app/data/admin_documents', exist_ok=True)
          open('/app/data/admin_documents/original.pdf', 'w').write('document-marker-7c1')
          "
          echo "dump-marker-7c1" > "$work/pg/uzstock-20261016T000000Z.dump"
          password="$(docker run --rm rclone/rclone:1.68.2 obscure ci-only-password-long-enough)"
          printf 'RCLONE_CONFIG_OFFSITE_TYPE=local\nRCLONE_CONFIG_SECURE_TYPE=crypt\nRCLONE_CONFIG_SECURE_REMOTE=offsite:/bucket\nRCLONE_CONFIG_SECURE_PASSWORD=%s\n' "$password" > "$work/rclone.env"
          DOCKER=docker ENV_FILE="$work/rclone.env" APP_IMAGE=uz-stock-bot DATA_VOLUME=offsite-test-data \
            PG_DIR="$work/pg" SCRIPTS="$PWD/scripts" RCLONE_DOCKER_ARGS="-v $work/bucket:/bucket" sh scripts/offsite_backup.sh
          if sudo grep -rq "marker-7c1" "$work/bucket"; then echo "plaintext reached the backup target"; exit 1; fi
          docker run --rm --env-file "$work/rclone.env" -v "$work/bucket:/bucket" -v "$work/restore:/restore" \
            rclone/rclone:1.68.2 copy secure: /restore
          sudo chmod -R a+rX "$work/restore"
          grep -q dump-marker-7c1 "$work/restore/postgres/uzstock-20261016T000000Z.dump"
          grep -q document-marker-7c1 "$work/restore/data/admin_documents/original.pdf"
          snapshot="$(ls "$work"/restore/sqlite/*/admin_control.sqlite3)"
          python3 -c "import sqlite3, sys; assert sqlite3.connect(sys.argv[1]).execute('SELECT x FROM t').fetchone()[0] == 'plain-marker-7c1'" "$snapshot"
          if [ -e "$work/restore/data/admin_control.sqlite3" ]; then echo "a live database file was uploaded raw"; exit 1; fi
          docker volume rm offsite-test-data >/dev/null


      - name: Log in to the release registry
        if: github.ref == 'refs/heads/API' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image and record its immutable digest
        id: publish
        if: github.ref == 'refs/heads/API' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy-production:
    # Production secrets live in this environment, which only the API
    # branch may use: a pushed branch editing this file cannot reach them.
    environment: uzstock-production
    name: Deploy production
    needs: [secret-scan, backend, frontend, docker, release-plan]
    permissions:
      contents: read
      packages: read
    # Production is updated only from the deployment branch, and only after the
    # full test/build suite above has passed.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/API' && needs.release-plan.outputs.deploy == 'true' && !contains(github.event.head_commit.message, '[diagnose-uzse]')
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect and back up bank data before reviewed release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-bank-ifrs]')
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          pwd -P
          git rev-parse HEAD
          docker inspect --format '{{.Config.Image}} {{.State.Status}} {{range .Mounts}}{{.Name}}:{{.Destination}} {{end}}' uzstock-web
          systemctl show uzstock-financial-ingestion.service -p FragmentPath -p ActiveState
          systemctl list-timers 'uzstock-financial-*' --no-pager
          docker exec uzstock-web python -m financial_ingestion.worker backup
          REMOTE

      - name: Inspect active application, service manager and HTTPS proxy
        # The VPS has both Nginx and OpenResty installed. Keep the active
        # listener visible in deployment logs so protected routes are always
        # configured in the process actually serving uzstock.uz.
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            'set -e; cd /root/uzstock/app; { pwd -P; git rev-parse HEAD; docker inspect --format "{{.Config.Image}} {{.State.Status}}" uzstock-web; systemctl list-units "uzstock-*" --all --no-pager; ps -eo pid,comm,args | grep -E "[n]ginx|[o]penresty" || true; ss -ltnp "sport = :443" || true; docker ps --format "{{.Names}} {{.Image}} {{.Ports}}" || true; systemctl is-active nginx || true; systemctl is-active openresty || true; command -v openresty || true; } 2>&1 | if [ -f scripts/ci_log.py ]; then python3 scripts/ci_log.py inspect 400; else cat; fi'

      - name: Synchronize Google OAuth configuration
        # OAuth credentials live only in GitHub Secrets and the production .env;
        # they are never committed to this repository or printed in CI logs.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "Google OAuth secrets are not configured; skipping synchronization."
            exit 0
          fi
          oauth_file="$(mktemp)"
          trap 'rm -f "$oauth_file"' EXIT
          python3 - "$oauth_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
          }), encoding="utf-8")
          PY
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$oauth_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.google-oauth.json"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          oauth_file=/root/uzstock/.google-oauth.json
          trap 'rm -f "$oauth_file"' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/root/uzstock/.google-oauth.json").read_text(encoding="utf-8"))
          values = {
              "PUBLIC_BASE_URL": "https://uzstock.uz",
              "CORS_ORIGINS": "https://uzstock.uz",
              "GOOGLE_REDIRECT_URI": "https://uzstock.uz/api/auth/oauth/google/callback",
              "GOOGLE_CLIENT_ID": str(payload["client_id"]),
              "GOOGLE_CLIENT_SECRET": str(payload["client_secret"]),
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise ValueError("OAuth values must not contain line breaks")
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          remaining = [line for line in lines if line.split("=", 1)[0] not in values]
          path.write_text("\n".join([*remaining, *(f"{key}={value}" for key, value in values.items())]) + "\n", encoding="utf-8")
          PY
          REMOTE

      - name: Synchronize Soliq company registry credential
        # The Soliq credential is server-only. The browser calls our API, and
        # the production container reads the key from the VPS environment.
        env:
          SOLIQ_API_KEY: ${{ secrets.SOLIQ_API_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$SOLIQ_API_KEY" ]; then
            echo "Soliq credential is not configured; skipping synchronization."
            exit 0
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$SOLIQ_API_KEY" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.soliq-secret"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret_file=/root/uzstock/.soliq-secret
          trap 'shred -u "$secret_file"' EXIT
          python3 - <<'PY'
          from pathlib import Path

          secret = Path("/root/uzstock/.soliq-secret").read_text(encoding="utf-8")
          if not secret or "\n" in secret or "\r" in secret:
              raise ValueError("Soliq credential must be a single non-empty line")
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          lines = [line for line in lines if line.split("=", 1)[0] != "SOLIQ_API_KEY"]
          path.write_text("\n".join([*lines, f"SOLIQ_API_KEY={secret}"]) + "\n", encoding="utf-8")
          PY
          REMOTE

      - name: Synchronize intraday collector credentials
        # The collection credential is a deploy secret, never source code.  The
        # host uses it only for the collector's authenticated write endpoints.
        env:
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$ADMIN_API_SECRET" ]; then
            echo "Collector credential is not configured; skipping synchronization."
            exit 0
          fi
          # It opens every machine push endpoint, so it must not be guessable.
          # Only its length is checked; the value is never printed.
          if [ "${#ADMIN_API_SECRET}" -lt 32 ]; then
            echo '::warning::ADMIN_API_SECRET is shorter than 32 characters. Replace it with a random one: gh secret set ADMIN_API_SECRET --env uzstock-production --body "$(openssl rand -hex 32)"'
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$ADMIN_API_SECRET" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.collector-secret"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret_file=/root/uzstock/.collector-secret
          trap 'shred -u "$secret_file"' EXIT
          python3 - <<'PY'
          from pathlib import Path

          secret = Path("/root/uzstock/.collector-secret").read_text(encoding="utf-8")
          if not secret or "\n" in secret or "\r" in secret:
              raise ValueError("collector credential must be a single non-empty line")
          values = {
              "ADMIN_API_SECRET": secret,
              "FINANCIALS_PUSH_URL": "http://uzstock-web:8000",
          }
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          remaining = [line for line in lines if line.split("=", 1)[0] not in values]
          path.write_text("\n".join([*remaining, *(f"{key}={value}" for key, value in values.items())]) + "\n", encoding="utf-8")
          PY
          REMOTE

      - name: Synchronize optional Claude gateway token
        # The Claude gateway normally keeps its own subscription login in the
        # uzstock_claude volume (`docker exec -it -u appuser uzstock-claude-gateway claude
        # auth login`, once).  A `claude setup-token` value in this optional
        # secret overrides that login; it is never put in the app env file.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret; the gateway uses its stored login."
            exit 0
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.claude-news-token"

      - name: Migrate selected administrator accounts
        # This is intentionally one-time and narrowly scoped: the payload contains
        # only the two explicitly configured administrators and their OAuth links.
        # It is supplied through a temporary GitHub secret, never committed or logged.
        env:
          ADMIN_MIGRATION_PAYLOAD: ${{ secrets.ADMIN_MIGRATION_PAYLOAD }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$ADMIN_MIGRATION_PAYLOAD" ]; then
            echo "No administrator migration payload is configured; skipping."
            exit 0
          fi
          admin_file="$(mktemp)"
          trap 'shred -u "$admin_file"' EXIT
          printf '%s' "$ADMIN_MIGRATION_PAYLOAD" > "$admin_file"
          python3 - "$admin_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if len(payload.get("admin_emails", [])) != 2 or len(payload.get("users", [])) != 2:
              raise ValueError("administrator migration must contain exactly two accounts")
          if len(payload.get("oauth", [])) != 2:
              raise ValueError("administrator migration must contain exactly two OAuth links")
          PY
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$admin_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.admin-migration.json"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          admin_file=/root/uzstock/.admin-migration.json
          trap 'shred -u "$admin_file"' EXIT
          docker cp "$admin_file" uzstock-web:/tmp/admin-migration.json
          docker exec -i uzstock-web python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg

          payload_path = Path("/tmp/admin-migration.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          emails = payload["admin_emails"]
          users = payload["users"]
          oauth_accounts = payload["oauth"]
          if len(emails) != 2 or len(users) != 2 or len(oauth_accounts) != 2:
              raise ValueError("expected exactly two administrator accounts and OAuth links")

          user_ids = {}
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  for user in users:
                      cur.execute(
                          """
                          INSERT INTO web_users (
                              email, full_name, password_hash, is_active, email_verified,
                              tier, subscription_until, created_at, last_login_at
                          ) VALUES (
                              %(email)s, %(full_name)s, %(password_hash)s, %(is_active)s,
                              %(email_verified)s, %(tier)s, %(subscription_until)s,
                              %(created_at)s, %(last_login_at)s
                          )
                          ON CONFLICT (email) DO UPDATE SET
                              full_name = EXCLUDED.full_name,
                              password_hash = EXCLUDED.password_hash,
                              is_active = EXCLUDED.is_active,
                              email_verified = EXCLUDED.email_verified,
                              tier = EXCLUDED.tier,
                              subscription_until = EXCLUDED.subscription_until,
                              last_login_at = COALESCE(EXCLUDED.last_login_at, web_users.last_login_at)
                          RETURNING id, email
                          """,
                          user,
                      )
                      user_id, email = cur.fetchone()
                      user_ids[email.lower()] = user_id

                  for account in oauth_accounts:
                      email = account["email"].lower()
                      user_id = user_ids[email]
                      cur.execute(
                          """
                          DELETE FROM web_oauth_accounts
                          WHERE user_id = %s AND provider = %s AND provider_user_id <> %s
                          """,
                          (user_id, account["provider"], account["provider_user_id"]),
                      )
                      cur.execute(
                          """
                          INSERT INTO web_oauth_accounts (
                              user_id, provider, provider_user_id, provider_email
                          ) VALUES (%s, %s, %s, %s)
                          ON CONFLICT (provider, provider_user_id) DO UPDATE SET
                              user_id = EXCLUDED.user_id,
                              provider_email = EXCLUDED.provider_email
                          """,
                          (user_id, account["provider"], account["provider_user_id"], account.get("provider_email")),
                      )
              conn.commit()

          values = {
              "ADMIN_EMAILS": ",".join(emails),
              "ADMIN_ROLES": json.dumps(payload.get("admin_roles", {}), separators=(",", ":")),
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise ValueError("administrator configuration must not contain line breaks")
          env_path = Path("/app/.env")
          # The host file is mounted only through --env-file, so update it below
          # after the database transaction is committed.
          Path("/tmp/admin-migration-result.json").write_text(
              json.dumps({"users_migrated": len(users), "oauth_links_migrated": len(oauth_accounts), "values": values}),
              encoding="utf-8",
          )
          print(f"migrated_users={len(users)} migrated_oauth_links={len(oauth_accounts)}")
          PY
          docker cp uzstock-web:/tmp/admin-migration-result.json /root/uzstock/.admin-migration-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/root/uzstock/.admin-migration-result.json").read_text(encoding="utf-8"))
          values = payload["values"]
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          remaining = [line for line in lines if line.split("=", 1)[0] not in values]
          path.write_text("\n".join([*remaining, *(f"{key}={value}" for key, value in values.items())]) + "\n", encoding="utf-8")
          print(f"configured_admin_accounts={len(values['ADMIN_EMAILS'].split(','))}")
          PY
          shred -u /root/uzstock/.admin-migration-result.json
          docker exec uzstock-web shred -u /tmp/admin-migration.json /tmp/admin-migration-result.json
          REMOTE

      - name: Synchronize off-site backup storage
        # The one backup that survives losing this server (scripts/offsite_backup.sh).
        # Any S3-compatible bucket: Cloudflare R2, AWS S3, Backblaze B2. Files are
        # encrypted with BACKUP_ENCRYPTION_PASSWORD before upload; keep that
        # password outside GitHub too, or the backup cannot be read.
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$BACKUP_S3_ENDPOINT" ] || [ -z "$BACKUP_S3_BUCKET" ] || [ -z "$BACKUP_S3_ACCESS_KEY_ID" ] \
             || [ -z "$BACKUP_S3_SECRET_ACCESS_KEY" ] || [ -z "$BACKUP_ENCRYPTION_PASSWORD" ]; then
            echo "::warning::Off-site backups are not configured, so every backup is on the production server only. Set BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY and BACKUP_ENCRYPTION_PASSWORD (and BACKUP_S3_REGION if the provider needs one) in the uzstock-production environment."
            exit 0
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSWORD}" -lt 20 ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSWORD must be at least 20 characters."
            exit 1
          fi
          config="$(mktemp)"
          trap 'shred -u "$config"' EXIT
          python3 - "$config" <<'PY'
          import json, os, sys
          keys = ("BACKUP_S3_ENDPOINT", "BACKUP_S3_BUCKET", "BACKUP_S3_REGION", "BACKUP_S3_ACCESS_KEY_ID",
                  "BACKUP_S3_SECRET_ACCESS_KEY", "BACKUP_ENCRYPTION_PASSWORD")
          values = {k: os.environ.get(k, "").strip() for k in keys}
          if any("\n" in v or "\r" in v for v in values.values()):
              sys.exit("backup settings must be single lines")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(values, handle)
          PY
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$config" "$PROD_USER@$PROD_HOST:/root/uzstock/.offsite-config.json"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'shred -u /root/uzstock/.offsite-config.json 2>/dev/null || true' EXIT
          image=rclone/rclone:1.68.2
          docker pull -q "$image" >/dev/null
          python3 - "$image" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          image = sys.argv[1]
          v = json.loads(Path("/root/uzstock/.offsite-config.json").read_text(encoding="utf-8"))
          obscured = subprocess.run(["docker", "run", "--rm", "-i", image, "obscure", "-"],
                                    input=v["BACKUP_ENCRYPTION_PASSWORD"], capture_output=True, text=True, check=True).stdout.strip()
          lines = {
              "RCLONE_CONFIG_OFFSITE_TYPE": "s3",
              "RCLONE_CONFIG_OFFSITE_PROVIDER": "Other",
              "RCLONE_CONFIG_OFFSITE_ENDPOINT": v["BACKUP_S3_ENDPOINT"],
              "RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID": v["BACKUP_S3_ACCESS_KEY_ID"],
              "RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY": v["BACKUP_S3_SECRET_ACCESS_KEY"],
              # A token scoped to one bucket may not list or create buckets.
              "RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET": "true",
              "RCLONE_CONFIG_SECURE_TYPE": "crypt",
              "RCLONE_CONFIG_SECURE_REMOTE": f"offsite:{v['BACKUP_S3_BUCKET']}/uzstock",
              "RCLONE_CONFIG_SECURE_PASSWORD": obscured,
          }
          if v["BACKUP_S3_REGION"]:
              lines["RCLONE_CONFIG_OFFSITE_REGION"] = v["BACKUP_S3_REGION"]
          target = Path("/root/uzstock/offsite-backup.env")
          fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as handle:
              handle.write("".join(f"{k}={val}\n" for k, val in lines.items()))
          PY
          # Prove the bucket accepts this credential now, not at 01:40 tonight.
          probe="deploy-check-$(date -u +%s)"
          docker run --rm --env-file /root/uzstock/offsite-backup.env "$image" touch "secure:checks/$probe" \
            || { echo "::error::The off-site bucket refused the backup credential; check the BACKUP_S3_* secrets."; rm -f /root/uzstock/offsite-backup.env; exit 1; }
          docker run --rm --env-file /root/uzstock/offsite-backup.env "$image" deletefile "secure:checks/$probe" >/dev/null 2>&1 || true
          echo "Off-site backup storage is configured and writable."
          REMOTE

      - name: Pull and verify the tested release before stopping services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          IMAGE_REF: ${{ needs.docker.outputs.image }}
          EXPECTED_SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os, shlex, subprocess
          from pathlib import Path
          script = Path('scripts/pull_release_image.sh').read_text()
          command = shlex.join(['bash', '-c', script, '--', os.environ['IMAGE_REF'],
                                os.environ['EXPECTED_SHA'], os.environ['REGISTRY_USER']])
          subprocess.run(['ssh', '-i', str(Path.home() / '.ssh/id_ed25519'),
                          '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes',
                          '-o', 'ServerAliveInterval=30', '-p', os.environ['PROD_PORT'],
                          os.environ['PROD_USER'] + '@' + os.environ['PROD_HOST'], command],
                         input=os.environ['REGISTRY_TOKEN'] + '\n', text=True, check=True)
          PYTHON

      - name: Update VPS
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          expected_sha="$1"
          [[ "$expected_sha" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git fetch origin API
          test "$(git rev-parse origin/API)" = "$expected_sha" || { echo "A newer release superseded this commit." >&2; exit 1; }
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "uzstock-web:release-$expected_sha")" = "$expected_sha"
          # Emergency fixes have occasionally been applied directly on the VPS.
          # Preserve them before advancing the deployment checkout: the stash is
          # recoverable for comparison or reapplication, while the running image
          # is always built from the reviewed API branch rather than an unknown
          # mixture of branch and host-only files.
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            backup_label="pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
            git stash push --include-untracked -m "$backup_label"
            echo "Preserved VPS checkout changes in $(git rev-parse --short refs/stash) ($backup_label)."
          fi
          git checkout --detach "$expected_sha"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          # A deployment replaces every scheduled worker image.  Stop a
          # currently running one before replacing it; timers are re-enabled
          # below and do not double-run a Railway-era command.
          for timer in \
            uzstock-terminal-alerts.timer uzstock-terminal-cbu.timer \
            uzstock-financial-backup.timer uzstock-postgres-backup.timer uzstock-financial-monitor.timer \
            uzstock-collector.timer uzstock-quotes-1610.timer \
            uzstock-quotes-2130.timer uzstock-quotes-catchup.timer uzstock-reports-watch.timer uzstock-hourly-bars.timer \
            uzstock-bank-fx.timer uzstock-bank-history.timer uzstock-financial-ingestion.timer uzstock-news-collector.timer uzstock-event-evidence.timer; do
            systemctl stop "$timer" >/dev/null 2>&1 || true
          done
          for service in \
            uzstock-terminal-alerts.service uzstock-terminal-cbu.service \
            uzstock-financial-backup.service uzstock-postgres-backup.service uzstock-financial-monitor.service \
            uzstock-collector.service uzstock-quotes-1610.service \
            uzstock-quotes-2130.service uzstock-quotes-catchup.service uzstock-reports-watch.service uzstock-hourly-bars.service \
            uzstock-bank-fx.service uzstock-bank-history.service uzstock-financial-ingestion.service uzstock-news-collector.service; do
            systemctl stop "$service" >/dev/null 2>&1 || true
          done
          # Alias the verified image for the existing service definitions; never rebuild here.
          docker tag "uzstock-web:release-$expected_sha" uzstock-web:latest
          # A root-owned SQLite replacement or a volume restored by Docker can
          # leave /app/data unwritable after the entrypoint drops to appuser.
          # Repair and prove access *before* replacing the live container, so a
          # bad volume never turns a routine release into a public 502.
          docker run --rm --network none --user root --entrypoint sh \
            -v uzstock_data:/app/data uzstock-web:latest -c '
              set -eu
              mkdir -p /app/data
              chown -R appuser:appuser /app/data
              gosu appuser touch /app/data/.uzstock-write-test
              rm -f /app/data/.uzstock-write-test
            '
          docker rm -f uzstock-web >/dev/null 2>&1 || true
          docker run -d \
            --name uzstock-web \
            --restart unless-stopped \
            --network uzstock-internal \
            --env-file /root/uzstock/app/.env \
            -e ADMIN_CONTROL_WORKER=0 \
            -p 127.0.0.1:8001:8000 \
            -v uzstock_data:/app/data \
            uzstock-web:latest \
            sh -c 'exec uvicorn api:app --host 0.0.0.0 --port 8000'
          for attempt in $(seq 1 15); do
            if curl -fsS -H 'Host: uzstock.uz' http://127.0.0.1/ >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS -H 'Host: uzstock.uz' http://127.0.0.1/ >/dev/null; then
            docker logs --tail 100 uzstock-web 2>&1 | python3 /root/uzstock/app/scripts/ci_log.py web-start 100 >&2
            exit 1
          fi
          # The home page is static and can answer while the API event loop is
          # stalled. Verify the actual API before declaring a deploy healthy.
          for attempt in $(seq 1 15); do
            if curl --max-time 5 -fsS http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --max-time 5 -fsS http://127.0.0.1:8001/health >/dev/null; then
            echo "UZStock API readiness check failed." >&2
            docker logs --tail 160 uzstock-web 2>&1 | python3 /root/uzstock/app/scripts/ci_log.py web-readiness 160 >&2
            exit 1
          fi
          install -d -m 755 /etc/nginx/snippets
          umask 077
          # Netdata is retired: with --pid=host and the Docker socket it was
          # root-equivalent, yet published at /monitor/ behind Basic auth alone.
          # The snippet keeps its old name and include marker so the live site
          # config is not re-edited. It now carries gzip and the per-client
          # request limit; scripts/nginx_edge.py writes it with its http-context
          # half (realip, the limit zone) and restores both if nginx rejects them.
          # A rejection warns rather than blocking the release.
          python3 /root/uzstock/app/scripts/nginx_edge.py write || true
          nginx_site_backup="$(mktemp)"
          python3 - "$nginx_site_backup" <<'PY'
          import re
          import sys
          from pathlib import Path

          marker = "# UZStock Netdata monitoring\n    include /etc/nginx/snippets/uzstock-monitor.conf;"
          candidates = [Path("/etc/nginx/nginx.conf")] + sorted(Path("/etc/nginx/sites-enabled").glob("*")) + sorted(Path("/etc/nginx/conf.d").glob("*.conf"))
          matched = False
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              insert_at = []
              for match in re.finditer(r"\bserver\s*\{", text):
                  start = match.start()
                  depth = 0
                  end = None
                  for index in range(match.end() - 1, len(text)):
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                          if depth == 0:
                              end = index
                              break
                  if end is None:
                      continue
                  block = text[start:end + 1]
                  is_uzstock_host = bool(re.search(r"\bserver_name\b[^;]*\buzstock\.uz\b", block))
                  is_tls_default = bool(re.search(r"\blisten\s+(?:\[::\]:)?443\b[^;]*\bdefault_server\b", block))
                  if not (is_uzstock_host or is_tls_default):
                      continue
                  matched = True
                  if marker not in block:
                      insert_at.append(end)
              if not insert_at:
                  continue
              # One config file is the active site on this VPS.  Preserve it
              # before editing, then add the route to every matching TLS block
              # (there can be a separate IPv4/IPv6 block).
              Path(sys.argv[1]).write_text(text, encoding="utf-8")
              for end in reversed(insert_at):
                  text = text[:end] + "\n    " + marker + "\n" + text[end:]
              path.write_text(text, encoding="utf-8")
              print(path)
              raise SystemExit(0)
          if not matched:
              raise SystemExit("Could not find the HTTPS Nginx server block for uzstock.uz")
          Path(sys.argv[1]).write_text("", encoding="utf-8")
          PY
          if ! nginx -t; then
            if [ -s "$nginx_site_backup" ]; then
              nginx_site_path="$(python3 - <<'PY'
          from pathlib import Path
          marker = "# UZStock Netdata monitoring\n    include /etc/nginx/snippets/uzstock-monitor.conf;"
          for path in sorted(Path('/etc/nginx/sites-enabled').glob('*')) + sorted(Path('/etc/nginx/conf.d').glob('*.conf')):
              if path.is_file() and marker in path.read_text(encoding='utf-8'):
                  print(path)
                  break
          PY
          )"
              cp "$nginx_site_backup" "$nginx_site_path"
            fi
            nginx -t >&2 || true
            exit 1
          fi
          rm -f "$nginx_site_backup"
          systemctl reload nginx
          # Ask the live site, through the provider's proxy, which address nginx
          # takes for the visitor; the per-client limit is keyed only once that
          # is the visitor's and not the proxy's (one bucket for everyone).
          python3 /root/uzstock/app/scripts/nginx_edge.py probe || echo "::warning::The nginx edge probe failed; see the lines above."
          asset_probe_path="$(curl -ksS --resolve uzstock.uz:443:127.0.0.1 https://uzstock.uz/ | sed -n 's/.*src="\([^"?]*\/assets\/[^"?]*\.js\)".*/\1/p' | head -n 1)"
          if [ -n "$asset_probe_path" ]; then
            echo "Asset response probe (directly against this VPS):"
            curl -ksS --resolve uzstock.uz:443:127.0.0.1 \
              -H 'Accept-Encoding: gzip' -D - -o /dev/null \
              "https://uzstock.uz${asset_probe_path}" | \
              grep -Ei '^(HTTP/|content-(encoding|length):|vary:)' || true
          fi
          # Tear down what earlier deploys created for Netdata. Safe to repeat.
          /snap/bin/docker rm -f uzstock-monitor >/dev/null 2>&1 || true
          /snap/bin/docker volume rm netdataconfig netdatalib netdatacache >/dev/null 2>&1 || true
          /snap/bin/docker image rm netdata/netdata:stable >/dev/null 2>&1 || true
          rm -f /etc/nginx/.htpasswd-uzstock-monitor
          if [ -e /root/uzstock/.netdata-password ]; then
            shred -u /root/uzstock/.netdata-password
          fi
          if curl -fsS --max-time 3 http://127.0.0.1:19999/api/v1/info >/dev/null 2>&1; then
            echo "Netdata is still answering on 127.0.0.1:19999 after removal." >&2
            exit 1
          fi
          # Claude gateway: the one long-running container holding the Claude
          # subscription login (volume uzstock_claude). The news collector
          # reaches it on the private network with a host-generated secret.
          rm -f /root/uzstock/.codex-auth-b64
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          gateway_env = Path("/root/uzstock/claude-gateway.env")
          news_env = Path("/root/uzstock/news-collector.env")
          token_file = Path("/root/uzstock/.claude-news-token")
          current = {}
          if gateway_env.exists():
              for line in gateway_env.read_text(encoding="utf-8").splitlines():
                  key, _, value = line.partition("=")
                  current[key] = value
          secret = current.get("CLAUDE_GATEWAY_SECRET") or secrets.token_hex(32)
          token = current.get("CLAUDE_CODE_OAUTH_TOKEN", "")
          if token_file.exists():
              token = token_file.read_text(encoding="utf-8").strip()
              token_file.write_bytes(b"\0" * max(1, len(token)))
              token_file.unlink()
          values = {"CLAUDE_GATEWAY_SECRET": secret, "CLAUDE_CONFIG_DIR": "/app/claude-home"}
          if token:
              values["CLAUDE_CODE_OAUTH_TOKEN"] = token
          os.umask(0o077)
          gateway_env.write_text("".join(f"{k}={v}\n" for k, v in values.items()), encoding="utf-8")
          news_env.write_text(f"CLAUDE_GATEWAY_SECRET={secret}\n", encoding="utf-8")
          gateway_env.chmod(0o600)
          news_env.chmod(0o600)
          PY
          /snap/bin/docker rm -f uzstock-claude-gateway >/dev/null 2>&1 || true
          /snap/bin/docker run -d \
            --name uzstock-claude-gateway \
            --restart unless-stopped \
            --cpus 1.0 \
            --log-driver journald --log-opt tag=uzstock-claude-gateway \
            --network uzstock-internal \
            --env-file /root/uzstock/claude-gateway.env \
            -v uzstock_claude:/app/claude-home \
            uzstock-web:latest \
            uvicorn claude_gateway:app --host 0.0.0.0 --port 8080 --no-access-log
          gateway_health=""
          for attempt in $(seq 1 20); do
            if gateway_health="$(/snap/bin/docker exec uzstock-claude-gateway python -c \
              'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=40).read().decode())' 2>/dev/null)"; then
              break
            fi
            gateway_health=""
            sleep 2
          done
          if [ -z "$gateway_health" ]; then
            echo "Claude gateway did not start." >&2
            journalctl -t uzstock-claude-gateway -n 80 --no-pager 2>&1 | python3 /root/uzstock/app/scripts/ci_log.py claude-gateway 80 >&2 || true
            exit 1
          fi
          echo "Claude gateway health: $gateway_health"
          if ! printf '%s' "$gateway_health" | grep -q '"logged_in":true'; then
            # The site still deploys; only news classification waits for the login.
            echo "::warning::Claude gateway is not logged in. Run once on the server: docker exec -it -u appuser uzstock-claude-gateway claude auth login"
          fi
          python3 - <<'PY'
          from pathlib import Path

          def worker(name: str, description: str, command: str, *, timeout: str = "30min",
                     data_volume: bool = False, extra_env: tuple[str, ...] = (), resources: str = "", cpus: str = "0.50",
                     env_file: str = "") -> str:
              volume = " -v uzstock_data:/app/data" if data_volume else ""
              env = (f" --env-file {env_file}" if env_file else "") + "".join(f" -e {value}" for value in extra_env)
              return f"""[Unit]
          Description={description}
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          TimeoutStartSec={timeout}
          ExecStartPre=-/snap/bin/docker rm -f {name}
          # The app's .env minus web-only secrets, rebuilt at every start so a
          # hand edit of .env reaches the next run (scripts/worker_env.py).
          ExecStartPre=/usr/bin/python3 /root/uzstock/app/scripts/worker_env.py /root/uzstock/app/.env /root/uzstock/worker.env
          # A collector can parse a large exchange response immediately after a
          # deploy. Keep half a CPU free for the public web container so an
          # initial collection cannot stall /health, heatmap or finance routes.
          # The journald log driver: an attached `docker run` under systemd left
          # the jobs' own lines out of the journal, so a failed run showed only
          # "status=1". Read a run with `journalctl -t {name}`.
          # uzse.uz blocked this host after ~30 crawls a day (2026-09-24). Pinned
          # off here, after the env file, so no .env on the server can turn a
          # collector back onto it; only openinfo is read (see uzse_access.py).
          ExecStart=/snap/bin/docker run --rm --cpus {cpus} {resources} --name {name} --log-driver journald --log-opt tag={name} --network uzstock-internal --env-file /root/uzstock/worker.env -e UZSE_ENABLED=0 -e FINANCIALS_PUSH_URL=http://uzstock-web:8000{volume}{env} uzstock-web:latest {command}
          """

          def timer(description: str, *calendars: str) -> str:
              on_calendar = "\n".join(f"OnCalendar={calendar}" for calendar in calendars)
              return f"""[Unit]
          Description={description}

          [Timer]
          {on_calendar}
          Persistent=true
          AccuracySec=1min

          [Install]
          WantedBy=timers.target
          """

          units = {
              "/etc/systemd/system/uzstock-terminal-alerts.service": """[Unit]
          Description=UZStock critical alerts and 09:00 Tashkent daily digest
          After=snap.docker.dockerd.service

          [Service]
          Type=oneshot
          TimeoutStartSec=90
          # Web container owns the explicitly configured Telegram/SMTP secrets.
          ExecStart=/snap/bin/docker exec -u appuser uzstock-web python -m server.terminal.alerts
          """,
              "/etc/systemd/system/uzstock-terminal-alerts.timer": timer(
                  "Deliver terminal alerts every minute", "*-*-* *:*:00"),
              "/etc/systemd/system/uzstock-terminal-cbu.service": worker(
                  "uzstock-terminal-cbu", "Refresh official CBU publications and historical FX",
                  "python -m scripts.terminal_cbu_sync --refresh", timeout="30min", data_volume=True,
                  resources="--memory 768m --memory-swap 768m")
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-terminal-cbu\n",
              "/etc/systemd/system/uzstock-terminal-cbu.timer": timer(
                  "Check monthly CBU tables for late publication daily", "*-*-* 06:30:00 Asia/Tashkent"),
              # The schedules below preserve Railway's currently active UTC cron
              # expressions.  The system clock on this VPS is UTC.
              "/etc/systemd/system/uzstock-collector.service": worker(
                  "uzstock-collector", "UZStock full financial data collector",
                  "python collector_financials.py", timeout="90min",
                  data_volume=True, extra_env=("BANK_HISTORY_BATCH=0",)),
              "/etc/systemd/system/uzstock-collector.timer": timer(
                  "Run UZStock full data collector on weekdays", "Mon..Fri *-*-* 03:00:00"),
              # Historical documents AND their provenance must survive the
              # worker. The stateless market collector only pushes figures.
              "/etc/systemd/system/uzstock-bank-history.service": worker(
                  "uzstock-bank-history", "UZStock persistent bank history repair",
                  "python collector_financials.py --bank-history-only --bank-history-due-only --bank-history-limit 3",
                  timeout="90min", data_volume=True),
              "/etc/systemd/system/uzstock-bank-history.timer": timer(
                  "Repair bank financial history daily", "*-*-* 02:00:00"),
              "/etc/systemd/system/uzstock-financial-ingestion.service": worker(
                  "uzstock-financial-ingestion", "UZStock NSBU history and IFRS document staging",
                  "python -m financial_ingestion.bulk --workers 2 --ocr --nsbu-history --report /app/data/bulk-financial-report.json",
                  timeout="24h", cpus="1.0", data_volume=True,
                  resources="--memory 3g --memory-swap 3g --pids-limit 256",
                  extra_env=("APP_DATA_DIR=/app/data", "FINANCIAL_ARTIFACT_DIR=/app/data/financial_artifacts",
                             "OMP_THREAD_LIMIT=1", "OPENBLAS_NUM_THREADS=1"))
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-financial-ingestion\n",
              "/etc/systemd/system/uzstock-financial-ingestion.timer": timer(
                  "Collect financial history nightly at 02:00 Tashkent", "*-*-* 02:00:00 Asia/Tashkent"),
              "/etc/systemd/system/uzstock-financial-backup.service": worker(
                  "uzstock-financial-backup", "Verified financial database and original-document backup",
                  "python -m financial_ingestion.worker backup", data_volume=True,
                  resources="--memory 768m --memory-swap 768m")
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-financial-backup\n",
              "/etc/systemd/system/uzstock-financial-backup.timer": timer(
                  "Back up financial evidence daily", "*-*-* 01:00:00"),
              # Accounts, sessions and analytics live in PostgreSQL, which the
              # financial backup above does not cover. Runs on the host from the
              # deployed checkout; see scripts/backup_postgres.sh.
              "/etc/systemd/system/uzstock-postgres-backup.service": """[Unit]
          Description=Verified nightly PostgreSQL backup (accounts, sessions, analytics)
          After=snap.docker.dockerd.service

          [Service]
          Type=oneshot
          TimeoutStartSec=30min
          ExecStart=/bin/sh /root/uzstock/app/scripts/backup_postgres.sh
          """,
              "/etc/systemd/system/uzstock-postgres-backup.timer": timer(
                  "Back up PostgreSQL daily", "*-*-* 00:40:00"),
              # Every backup above stays on this server. This one copies them,
              # every SQLite database and the data volume, encrypted, to the
              # bucket in /root/uzstock/offsite-backup.env; see
              # scripts/offsite_backup.sh. Enabled only when that file exists.
              "/etc/systemd/system/uzstock-offsite-backup.service": """[Unit]
          Description=Encrypted off-site copy of backups and data
          After=snap.docker.dockerd.service

          [Service]
          Type=oneshot
          TimeoutStartSec=4h
          ExecStart=/bin/sh /root/uzstock/app/scripts/offsite_backup.sh
          """,
              "/etc/systemd/system/uzstock-offsite-backup.timer": timer(
                  "Copy backups off-site daily, after the local backups", "*-*-* 01:40:00"),
              "/etc/systemd/system/uzstock-financial-monitor.service": worker(
                  "uzstock-financial-monitor", "Financial pipeline incidents and freshness checks",
                  "python -m financial_ingestion.worker monitor", data_volume=True,
                  resources="--memory 256m --memory-swap 256m")
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-financial-monitor\n",
              "/etc/systemd/system/uzstock-financial-monitor.timer": timer(
                  "Monitor financial evidence every fifteen minutes", "*-*-* *:10,25,40,55:00"),
              # Every openinfo reader mounts the data volume: the openinfo
              # pause after repeated 403/429 and the daily request count live
              # there, and a worker without it neither honours a pause another
              # process tripped nor appears in the count.
              "/etc/systemd/system/uzstock-quotes-1610.service": worker(
                  "uzstock-quotes-1610", "UZStock post-close quotes collector",
                  "python collector_financials.py --trades-only", data_volume=True),
              "/etc/systemd/system/uzstock-quotes-1610.timer": timer(
                  "Run UZStock 16:10 local quotes collector", "Mon..Sat *-*-* 11:10:00"),
              "/etc/systemd/system/uzstock-quotes-2130.service": worker(
                  "uzstock-quotes-2130", "UZStock final-session quotes collector",
                  "python collector_financials.py --trades-only", data_volume=True),
              "/etc/systemd/system/uzstock-quotes-2130.timer": timer(
                  "Run UZStock 21:30 local quotes collector", "Mon..Sat *-*-* 16:30:00"),
              # The fallback when a scheduled run above fails (09.10.2026: both
              # Friday runs failed and the board stayed on Thursday all weekend).
              # Each run first asks openinfo whether prod already holds the newest
              # session (one or two requests) and stops there, so on a good day
              # these cost almost nothing; after a failure they publish it. Spaced
              # past the 60-minute openinfo pause a refused run may have tripped:
              # 18:00 and 23:30 retry the 16:10 and 21:30 runs, and 09:30 every
              # day, before the session opens, takes the official conclusions —
              # Sunday included, so a lost Friday no longer waits for Monday.
              "/etc/systemd/system/uzstock-quotes-catchup.service": worker(
                  "uzstock-quotes-catchup", "UZStock quotes catch-up after a failed run",
                  "python collector_financials.py --trades-only", data_volume=True),
              "/etc/systemd/system/uzstock-quotes-catchup.timer": timer(
                  "Re-run the UZStock quotes collector after a failed run",
                  "*-*-* 04:30:00", "Mon..Sat *-*-* 13:00:00", "Mon..Sat *-*-* 18:30:00"),
              # The 1Д/1Н chart during the session: one openinfo request an
              # hour (the session so far in a single page), bars only. The
              # board itself waits for the evening run and the conclusions.
              "/etc/systemd/system/uzstock-hourly-bars.service": worker(
                  "uzstock-hourly-bars", "UZStock hourly bars from openinfo's live executions",
                  "python collector_financials.py --intraday-only", timeout="10min", data_volume=True),
              "/etc/systemd/system/uzstock-hourly-bars.timer": timer(
                  "Refresh hourly bars 11:05-16:05 Tashkent", "Mon..Sat *-*-* 06..11:05:00"),
              "/etc/systemd/system/uzstock-reports-watch.service": worker(
                  "uzstock-reports-watch", "UZStock newly filed reports watcher",
                  "python collector_financials.py --watch-filings", data_volume=True),
              "/etc/systemd/system/uzstock-reports-watch.timer": timer(
                  "Run UZStock reports watcher", "Mon..Sat *-*-* 18:00:00"),
              "/etc/systemd/system/uzstock-bank-fx.service": worker(
                  "uzstock-bank-fx", "UZStock commercial bank FX collector",
                  "python collector_financials.py --bank-fx-only"),
              "/etc/systemd/system/uzstock-bank-fx.timer": timer(
                  "Run UZStock bank FX collector", "*-*-* 06:10:00"),
              "/etc/systemd/system/uzstock-event-evidence.service": worker(
                  "uzstock-event-evidence", "UZStock corporate disclosure evidence enrichment",
                  "python corporate_event_backfill.py --limit 40 --days 120", timeout="45min", data_volume=True),
              "/etc/systemd/system/uzstock-event-evidence.timer": timer(
                  "Enrich corporate disclosure evidence", "*-*-* 14:20:00"),
              "/etc/systemd/system/uzstock-news-collector.service": worker(
                  "uzstock-news-collector", "UZStock Claude news collector",
                  "python news_collector.py", timeout="60min", data_volume=True,
                  env_file="/root/uzstock/news-collector.env",
                  extra_env=(
                      "NEWS_CLAUDE_GATEWAY_URL=http://uzstock-claude-gateway:8080",
                      "NEWS_CLAUDE_MODEL=claude-haiku-4-5",
                      "NEWS_CLAUDE_FALLBACK_MODEL=claude-sonnet-5-5",
                      "NEWS_CLAUDE_EFFORT=low",
                      "NEWS_CLAUDE_TIMEOUT=180",
                      "NEWS_OG_MAX_FETCH=40",
                      "NEWS_PUSH_URL=https://uzstock.uz",
                      "TZ=Asia/Tashkent",
                  )),
              "/etc/systemd/system/uzstock-news-collector.timer": timer(
                  "Run UZStock Claude news collector", "*-*-* 11:10:00"),
          }
          for name, content in units.items():
              Path(name).write_text(content, encoding="utf-8")
          PY
          # Retired 2026-09-25: an hourly, round-the-clock walk of the uzse.uz
          # trade feed (plus one more after every deploy) and a mid-session
          # 13:00 run added up to ~30 full crawls a day, and uzse.uz blocked
          # this host's IP. Hourly bars come from each execution's own
          # timestamp, so the 16:10 and 21:30 runs still build every hour of
          # the session; nothing is lost but mid-session freshness.
          for retired in uzstock-intraday uzstock-quotes-1300; do
            systemctl disable --now "$retired.timer" >/dev/null 2>&1 || true
            systemctl stop "$retired.service" >/dev/null 2>&1 || true
            docker rm -f "$retired" >/dev/null 2>&1 || true
            rm -f "/etc/systemd/system/$retired.timer" "/etc/systemd/system/$retired.service"
          done
          systemctl daemon-reload
          for timer in \
            uzstock-terminal-alerts.timer uzstock-terminal-cbu.timer \
            uzstock-financial-backup.timer uzstock-postgres-backup.timer uzstock-financial-monitor.timer \
            uzstock-collector.timer uzstock-quotes-1610.timer \
            uzstock-quotes-2130.timer uzstock-quotes-catchup.timer uzstock-reports-watch.timer uzstock-hourly-bars.timer \
            uzstock-bank-fx.timer uzstock-bank-history.timer uzstock-financial-ingestion.timer uzstock-news-collector.timer uzstock-event-evidence.timer; do
            systemctl enable --now "$timer"
            systemctl is-active --quiet "$timer"
          done
          if [ -s /root/uzstock/offsite-backup.env ]; then
            systemctl enable --now uzstock-offsite-backup.timer
            systemctl is-active --quiet uzstock-offsite-backup.timer
          else
            systemctl disable --now uzstock-offsite-backup.timer >/dev/null 2>&1 || true
          fi
          REMOTE

  # Two checks after a deploy. Public traffic reaches the VPS through the
  # hosting provider's OpenResty front proxy, and from GitHub's runners that
  # route sometimes answers nothing for minutes while the site itself is up
  # (2026-10-14: 3 of 4 deploys failed on it, while the same page loaded in
  # 2.4 s from Tashkent and from 12 countries). So the deploy is judged on the
  # server — the same page, through an SSH tunnel to its own nginx — and the
  # public route is checked separately and only warns.
  verify-production-market:
    # Production secrets live in this environment, which only the API
    # branch may use: a pushed branch editing this file cannot reach them.
    environment: uzstock-production
    name: Verify market on the production server
    needs: deploy-production
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Open a tunnel to the server's nginx
        # The key opens a root shell on the server, and the next step runs code
        # from node_modules. So the key exists only for this step: `ssh -f`
        # backgrounds after it has authenticated, the key file is shredded
        # straight after, and the tunnel lives on without it.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          key="$(mktemp)"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 \
            -f -N -L 127.0.0.1:8443:127.0.0.1:443 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST"
          shred -u "$key"
          for attempt in $(seq 1 30); do
            if curl -ksS --max-time 5 --resolve uzstock.uz:8443:127.0.0.1 -o /dev/null https://uzstock.uz:8443/market; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The server's nginx did not answer /market through the tunnel."
          exit 1
      - name: Load the market with real assets and real data
        env:
          E2E_BASE_URL: https://uzstock.uz
          E2E_ORIGIN: 127.0.0.1:8443
          E2E_PRODUCTION_SMOKE: "1"
        run: npx playwright test e2e/production-market.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-market-verification
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  check-public-market:
    name: Check market through the public address
    needs: deploy-production
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 8
    # A failure here is the route to the site, not the site: it warns and
    # never fails the run. The warning lands on the run page and its summary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Load the public market from outside Uzbekistan
        id: public
        env:
          E2E_BASE_URL: https://uzstock.uz
          E2E_PRODUCTION_SMOKE: "1"
        run: npx playwright test e2e/production-market.spec.js --workers=1 --retries=2
      - name: Report an unreachable public route
        if: failure() && steps.public.outcome == 'failure'
        run: |
          message="uzstock.uz/market did not load through the public address from GitHub's runner (3 tries). The site itself is judged by «Verify market on the production server»; this points at the route through the hosting provider's front proxy."
          echo "::warning title=Public route to uzstock.uz::$message"
          { echo "### ⚠️ Public route to uzstock.uz"; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-market-check
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  repair-financial-balances:
    environment: uzstock-production
    name: Reconcile balances against exact official filings
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/API' && contains(github.event.head_commit.message, '[repair-financial-balances]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect, back up and reconcile retained balances
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "bash -s -- '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          test "$(git rev-parse HEAD)" = "$1"
