name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_news_now:
        description: Run the production Codex news collector after deployment
        required: false
        type: boolean
        default: false
      report_news_usage:
        description: Print the latest production news-collector usage record without running Codex
        required: false
        type: boolean
        default: false
      backfill_financial_ticker:
        description: Parse and publish one issuer's historical annual financials (for example UZTL)
        required: false
        type: string
        default: ""
      backfill_quarter_history_ticker:
        description: Recover one issuer's quarterly filings older than OpenInfo's ten-report window (for example YGSY)
        required: false
        type: string
        default: ""

# A push that supersedes an in-flight run cancels it — CI feedback should be about
# the current head, not a queue of stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secret scan. The repository is public: a committed key is exposed the moment
  # it is pushed, so every change is scanned and a finding blocks deployment.
  # Known false positives are listed in .gitleaksignore.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the working tree and the pushed commits for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          BEFORE: ${{ github.event.before }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir --redact --no-banner .
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            ./gitleaks git --redact --no-banner --log-opts="$BEFORE..HEAD" .
          fi

  # ---------------------------------------------------------------------------
  # Backend. The previous version of this job compiled 11 of ~30 modules and ran
  # zero tests, so the numeric transforms in reports_catalog / analysis_service —
  # exactly where the 1000x parse bug, the sign bugs and the period mislabel lived
  # — were never exercised by anything.
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-local-test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt -r requirements-dev.txt

      - name: Compile every module
        # Not a hand-maintained list: a new module must not be able to join the
        # repo already broken because nobody added it here.
        run: python -m compileall -q .

      - name: Verify the server image declares every import it uses
        # The failure this catches: feedparser and pdfplumber were imported by
        # collector code but absent from requirements-server.txt, so the Railway
        # cron jobs exited 0 having silently collected nothing for weeks.
        run: python scripts/check_server_requirements.py

      - name: Required reporting module regressions
        env:
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_BACKEND: sqlite
          DATABASE_URL: ""
          DATABASE_PUBLIC_URL: ""
          APP_DATA_DIR: ${{ runner.temp }}/uzstock-module-tests
          CATALOG_WATCH: "0"
          NEWS_CALENDAR_WATCH: "0"
          SECTOR_ANALYSIS_WORKER: "0"
          ADMIN_CONTROL_WORKER: "0"
        run: >-
          python -m pytest tests/test_reporting_boundaries.py
          tests/test_issuer_analysis_api.py tests/test_email_verification.py
          tests/test_sector_contract_v22.py tests/test_sector_analysis_service.py
          tests/test_admin_control.py -q

      - name: Required full backend suite and architecture boundaries
        env:
          TEST_POSTGRES_URL: postgresql://qa:qa-local-test@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgresql://qa:qa-local-test@127.0.0.1:5432/postgres
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_BACKEND: sqlite
          DATABASE_URL: ""
          DATABASE_PUBLIC_URL: ""
          APP_DATA_DIR: ${{ runner.temp }}/uzstock-full-tests
          CATALOG_WATCH: "0"
          NEWS_CALENDAR_WATCH: "0"
          SECTOR_ANALYSIS_WORKER: "0"
          ADMIN_CONTROL_WORKER: "0"
        run: python -m pytest tests -q

      - name: Required bank ingestion safety tests
        run: python -m pytest tests/test_financial_ingestion.py tests/test_financial_ingestion_recovery.py tests/test_ifrs_financials.py tests/test_bank_history_repair.py -q

  # ---------------------------------------------------------------------------
  # Frontend. Lint is load-bearing here, not cosmetic: react-hooks/rules-of-hooks
  # is the only mechanical guard against the CompareTable class of crash (a hook
  # after an early return) in a 10k-line, ~60-component file.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Rules of Hooks is an error)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Complete local browser regression suite
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The image both cron collectors and the API actually run.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t uz-stock-bot .
      - name: Smoke-check the runtime dependencies inside the image
        # Import every package the collectors need, in the built image — the only
        # place that answers "will tonight's cron actually work".
        run: |
          docker run --rm --entrypoint python uz-stock-bot -c "
          import importlib, sys
          import scripts.publish_reviewed_bank_ifrs
          from runtime_preflight import COLLECTOR_REQUIREMENTS, NEWS_REQUIREMENTS
          missing = [n for n in {**COLLECTOR_REQUIREMENTS, **NEWS_REQUIREMENTS}
                     if importlib.util.find_spec(n) is None]
          print('checked', len({**COLLECTOR_REQUIREMENTS, **NEWS_REQUIREMENTS}), 'packages')
          if missing:
              sys.exit('MISSING in the server image: ' + ', '.join(missing))
          print('all collector dependencies present')
          "

  deploy-production:
    name: Deploy production
    needs: [secret-scan, backend, frontend, docker]
    # Production is updated only from the deployment branch, and only after the
    # full test/build suite above has passed.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/API'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect and back up bank data before reviewed release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-bank-ifrs]')
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          pwd -P
          git rev-parse HEAD
          docker inspect --format '{{.Config.Image}} {{.State.Status}} {{range .Mounts}}{{.Name}}:{{.Destination}} {{end}}' uzstock-web
          systemctl show uzstock-financial-ingestion.service -p FragmentPath -p ActiveState
          systemctl list-timers 'uzstock-financial-*' --no-pager
          docker exec uzstock-web python -m financial_ingestion.worker backup
          REMOTE

      - name: Inspect active application, service manager and HTTPS proxy
        # The VPS has both Nginx and OpenResty installed. Keep the active
        # listener visible in deployment logs so protected routes are always
        # configured in the process actually serving uzstock.uz.
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            'set -e; cd /root/uzstock/app; pwd -P; git rev-parse HEAD; docker inspect --format "{{.Config.Image}} {{.State.Status}}" uzstock-web; systemctl list-units "uzstock-*" --all --no-pager; ps -eo pid,comm,args | grep -E "[n]ginx|[o]penresty" || true; ss -ltnp "sport = :443" || true; docker ps --format "{{.Names}} {{.Image}} {{.Ports}}" || true; systemctl is-active nginx || true; systemctl is-active openresty || true; command -v openresty || true'

      - name: Synchronize Google OAuth configuration
        # OAuth credentials live only in GitHub Secrets and the production .env;
        # they are never committed to this repository or printed in CI logs.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "Google OAuth secrets are not configured; skipping synchronization."
            exit 0
          fi
          oauth_file="$(mktemp)"
          trap 'rm -f "$oauth_file"' EXIT
          python3 - "$oauth_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
          }), encoding="utf-8")
          PY
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$oauth_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.google-oauth.json"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          oauth_file=/root/uzstock/.google-oauth.json
          trap 'rm -f "$oauth_file"' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/root/uzstock/.google-oauth.json").read_text(encoding="utf-8"))
          values = {
              "PUBLIC_BASE_URL": "https://uzstock.uz",
              "CORS_ORIGINS": "https://uzstock.uz",
              "GOOGLE_REDIRECT_URI": "https://uzstock.uz/api/auth/oauth/google/callback",
              "GOOGLE_CLIENT_ID": str(payload["client_id"]),
              "GOOGLE_CLIENT_SECRET": str(payload["client_secret"]),
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise ValueError("OAuth values must not contain line breaks")
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          remaining = [line for line in lines if line.split("=", 1)[0] not in values]
          path.write_text("\n".join([*remaining, *(f"{key}={value}" for key, value in values.items())]) + "\n", encoding="utf-8")
          PY
          REMOTE

      - name: Synchronize Soliq company registry credential
        # The Soliq credential is server-only. The browser calls our API, and
        # the production container reads the key from the VPS environment.
        env:
          SOLIQ_API_KEY: ${{ secrets.SOLIQ_API_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$SOLIQ_API_KEY" ]; then
            echo "Soliq credential is not configured; skipping synchronization."
            exit 0
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$SOLIQ_API_KEY" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.soliq-secret"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret_file=/root/uzstock/.soliq-secret
          trap 'shred -u "$secret_file"' EXIT
          python3 - <<'PY'
          from pathlib import Path

          secret = Path("/root/uzstock/.soliq-secret").read_text(encoding="utf-8")
          if not secret or "\n" in secret or "\r" in secret:
              raise ValueError("Soliq credential must be a single non-empty line")
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          lines = [line for line in lines if line.split("=", 1)[0] != "SOLIQ_API_KEY"]
          path.write_text("\n".join([*lines, f"SOLIQ_API_KEY={secret}"]) + "\n", encoding="utf-8")
          PY
          REMOTE

      - name: Synchronize intraday collector credentials
        # The collection credential is a deploy secret, never source code.  The
        # host uses it only for the collector's authenticated write endpoints.
        env:
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$ADMIN_API_SECRET" ]; then
            echo "Collector credential is not configured; skipping synchronization."
            exit 0
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$ADMIN_API_SECRET" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.collector-secret"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret_file=/root/uzstock/.collector-secret
          trap 'shred -u "$secret_file"' EXIT
          python3 - <<'PY'
          from pathlib import Path

          secret = Path("/root/uzstock/.collector-secret").read_text(encoding="utf-8")
          if not secret or "\n" in secret or "\r" in secret:
              raise ValueError("collector credential must be a single non-empty line")
          values = {
              "ADMIN_API_SECRET": secret,
              "FINANCIALS_PUSH_URL": "http://uzstock-web:8000",
          }
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          remaining = [line for line in lines if line.split("=", 1)[0] not in values]
          path.write_text("\n".join([*remaining, *(f"{key}={value}" for key, value in values.items())]) + "\n", encoding="utf-8")
          PY
          REMOTE

      - name: Synchronize Codex news credentials
        # The news worker authenticates with the already configured Codex
        # subscription profile.  It is seeded into the Docker volume below,
        # never committed or put in the application environment file.
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$CODEX_AUTH_JSON_B64" ]; then
            echo "Codex news credential is not configured."
            exit 1
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$CODEX_AUTH_JSON_B64" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.codex-auth-b64"

      - name: Synchronize Netdata dashboard password
        # The monitoring UI is intentionally not public.  Its password stays a
        # GitHub deployment secret and is used only to build Nginx's htpasswd
        # file on the VPS.
        env:
          NETDATA_PASSWORD: ${{ secrets.NETDATA_PASSWORD }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$NETDATA_PASSWORD" ]; then
            echo "Netdata dashboard password is not configured." >&2
            exit 1
          fi
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file"' EXIT
          printf '%s' "$NETDATA_PASSWORD" > "$secret_file"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$secret_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.netdata-password"

      - name: Migrate selected administrator accounts
        # This is intentionally one-time and narrowly scoped: the payload contains
        # only the two explicitly configured administrators and their OAuth links.
        # It is supplied through a temporary GitHub secret, never committed or logged.
        env:
          ADMIN_MIGRATION_PAYLOAD: ${{ secrets.ADMIN_MIGRATION_PAYLOAD }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$ADMIN_MIGRATION_PAYLOAD" ]; then
            echo "No administrator migration payload is configured; skipping."
            exit 0
          fi
          admin_file="$(mktemp)"
          trap 'shred -u "$admin_file"' EXIT
          printf '%s' "$ADMIN_MIGRATION_PAYLOAD" > "$admin_file"
          python3 - "$admin_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if len(payload.get("admin_emails", [])) != 2 or len(payload.get("users", [])) != 2:
              raise ValueError("administrator migration must contain exactly two accounts")
          if len(payload.get("oauth", [])) != 2:
              raise ValueError("administrator migration must contain exactly two OAuth links")
          PY
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -P "$PROD_PORT" "$admin_file" \
            "$PROD_USER@$PROD_HOST:/root/uzstock/.admin-migration.json"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          admin_file=/root/uzstock/.admin-migration.json
          trap 'shred -u "$admin_file"' EXIT
          docker cp "$admin_file" uzstock-web:/tmp/admin-migration.json
          docker exec -i uzstock-web python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg

          payload_path = Path("/tmp/admin-migration.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          emails = payload["admin_emails"]
          users = payload["users"]
          oauth_accounts = payload["oauth"]
          if len(emails) != 2 or len(users) != 2 or len(oauth_accounts) != 2:
              raise ValueError("expected exactly two administrator accounts and OAuth links")

          user_ids = {}
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  for user in users:
                      cur.execute(
                          """
                          INSERT INTO web_users (
                              email, full_name, password_hash, is_active, email_verified,
                              tier, subscription_until, created_at, last_login_at
                          ) VALUES (
                              %(email)s, %(full_name)s, %(password_hash)s, %(is_active)s,
                              %(email_verified)s, %(tier)s, %(subscription_until)s,
                              %(created_at)s, %(last_login_at)s
                          )
                          ON CONFLICT (email) DO UPDATE SET
                              full_name = EXCLUDED.full_name,
                              password_hash = EXCLUDED.password_hash,
                              is_active = EXCLUDED.is_active,
                              email_verified = EXCLUDED.email_verified,
                              tier = EXCLUDED.tier,
                              subscription_until = EXCLUDED.subscription_until,
                              last_login_at = COALESCE(EXCLUDED.last_login_at, web_users.last_login_at)
                          RETURNING id, email
                          """,
                          user,
                      )
                      user_id, email = cur.fetchone()
                      user_ids[email.lower()] = user_id

                  for account in oauth_accounts:
                      email = account["email"].lower()
                      user_id = user_ids[email]
                      cur.execute(
                          """
                          DELETE FROM web_oauth_accounts
                          WHERE user_id = %s AND provider = %s AND provider_user_id <> %s
                          """,
                          (user_id, account["provider"], account["provider_user_id"]),
                      )
                      cur.execute(
                          """
                          INSERT INTO web_oauth_accounts (
                              user_id, provider, provider_user_id, provider_email
                          ) VALUES (%s, %s, %s, %s)
                          ON CONFLICT (provider, provider_user_id) DO UPDATE SET
                              user_id = EXCLUDED.user_id,
                              provider_email = EXCLUDED.provider_email
                          """,
                          (user_id, account["provider"], account["provider_user_id"], account.get("provider_email")),
                      )
              conn.commit()

          values = {
              "ADMIN_EMAILS": ",".join(emails),
              "ADMIN_ROLES": json.dumps(payload.get("admin_roles", {}), separators=(",", ":")),
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise ValueError("administrator configuration must not contain line breaks")
          env_path = Path("/app/.env")
          # The host file is mounted only through --env-file, so update it below
          # after the database transaction is committed.
          Path("/tmp/admin-migration-result.json").write_text(
              json.dumps({"users_migrated": len(users), "oauth_links_migrated": len(oauth_accounts), "values": values}),
              encoding="utf-8",
          )
          print(f"migrated_users={len(users)} migrated_oauth_links={len(oauth_accounts)}")
          PY
          docker cp uzstock-web:/tmp/admin-migration-result.json /root/uzstock/.admin-migration-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/root/uzstock/.admin-migration-result.json").read_text(encoding="utf-8"))
          values = payload["values"]
          path = Path("/root/uzstock/app/.env")
          lines = path.read_text(encoding="utf-8").splitlines()
          remaining = [line for line in lines if line.split("=", 1)[0] not in values]
          path.write_text("\n".join([*remaining, *(f"{key}={value}" for key, value in values.items())]) + "\n", encoding="utf-8")
          print(f"configured_admin_accounts={len(values['ADMIN_EMAILS'].split(','))}")
          PY
          shred -u /root/uzstock/.admin-migration-result.json
          docker exec uzstock-web shred -u /tmp/admin-migration.json /tmp/admin-migration-result.json
          REMOTE

      - name: Update VPS
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          git fetch origin API
          # Emergency fixes have occasionally been applied directly on the VPS.
          # Preserve them before advancing the deployment checkout: the stash is
          # recoverable for comparison or reapplication, while the running image
          # is always built from the reviewed API branch rather than an unknown
          # mixture of branch and host-only files.
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            backup_label="pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
            git stash push --include-untracked -m "$backup_label"
            echo "Preserved VPS checkout changes in $(git rev-parse --short refs/stash) ($backup_label)."
          fi
          git merge --ff-only origin/API
          # A deployment replaces every scheduled worker image.  Stop a
          # currently running one before replacing it; timers are re-enabled
          # below and do not double-run a Railway-era command.
          for timer in \
            uzstock-financial-backup.timer uzstock-postgres-backup.timer uzstock-financial-monitor.timer \
            uzstock-collector.timer uzstock-quotes-1610.timer \
            uzstock-quotes-2130.timer uzstock-reports-watch.timer \
            uzstock-bank-fx.timer uzstock-bank-history.timer uzstock-financial-ingestion.timer uzstock-news-collector.timer; do
            systemctl stop "$timer" >/dev/null 2>&1 || true
          done
          for service in \
            uzstock-financial-backup.service uzstock-postgres-backup.service uzstock-financial-monitor.service \
            uzstock-collector.service uzstock-quotes-1610.service \
            uzstock-quotes-2130.service uzstock-reports-watch.service \
            uzstock-bank-fx.service uzstock-bank-history.service uzstock-financial-ingestion.service uzstock-news-collector.service; do
            systemctl stop "$service" >/dev/null 2>&1 || true
          done
          docker build -t uzstock-web:latest .
          # A root-owned SQLite replacement or a volume restored by Docker can
          # leave /app/data unwritable after the entrypoint drops to appuser.
          # Repair and prove access *before* replacing the live container, so a
          # bad volume never turns a routine release into a public 502.
          docker run --rm --network none --user root --entrypoint sh \
            -v uzstock_data:/app/data uzstock-web:latest -c '
              set -eu
              mkdir -p /app/data
              chown -R appuser:appuser /app/data
              gosu appuser touch /app/data/.uzstock-write-test
              rm -f /app/data/.uzstock-write-test
            '
          docker rm -f uzstock-web >/dev/null 2>&1 || true
          docker run -d \
            --name uzstock-web \
            --restart unless-stopped \
            --network uzstock-internal \
            --env-file /root/uzstock/app/.env \
            -e ADMIN_CONTROL_WORKER=0 \
            -p 127.0.0.1:8001:8000 \
            -v uzstock_data:/app/data \
            uzstock-web:latest \
            sh -c 'exec uvicorn api:app --host 0.0.0.0 --port 8000'
          for attempt in $(seq 1 15); do
            if curl -fsS -H 'Host: uzstock.uz' http://127.0.0.1/ >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS -H 'Host: uzstock.uz' http://127.0.0.1/ >/dev/null; then
            docker logs --tail 100 uzstock-web >&2
            exit 1
          fi
          # The home page is static and can answer while the API event loop is
          # stalled. Verify the actual API before declaring a deploy healthy.
          for attempt in $(seq 1 15); do
            if curl --max-time 5 -fsS http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --max-time 5 -fsS http://127.0.0.1:8001/health >/dev/null; then
            echo "UZStock API readiness check failed." >&2
            docker logs --tail 160 uzstock-web >&2
            exit 1
          fi
          netdata_password_file=/root/uzstock/.netdata-password
          if [ ! -s "$netdata_password_file" ]; then
            echo "Netdata dashboard password was not uploaded." >&2
            exit 1
          fi
          if ! grep -qE '^[^[:space:]]+$' "$netdata_password_file" || [ "$(wc -l < "$netdata_password_file")" -ne 0 ]; then
            echo "Netdata dashboard password must be one non-empty line." >&2
            exit 1
          fi
          install -d -m 755 /etc/nginx/snippets
          umask 077
          printf 'netdata:%s\n' "$(openssl passwd -apr1 -in "$netdata_password_file")" > /etc/nginx/.htpasswd-uzstock-monitor
          chown root:www-data /etc/nginx/.htpasswd-uzstock-monitor
          chmod 640 /etc/nginx/.htpasswd-uzstock-monitor
          python3 - <<'PY'
          from pathlib import Path

          Path("/etc/nginx/snippets/uzstock-monitor.conf").write_text("""# Public traffic reaches this nginx through an OpenResty (Nginx Proxy Manager)
          # front proxy outside the VPS. It passes compressed responses through
          # (verified 2026-09-23: 40/40 gzip requests returned 200), so compress here.
          gzip on;
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 5;
          gzip_min_length 1024;
          gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

          # The Netdata container is bound to localhost only. This proxy is the
          # sole externally reachable route and requires HTTP Basic auth.
          location = /monitor {
              return 301 /monitor/;
          }

          # ^~ takes precedence over the SPA's catch-all location.
          location ^~ /monitor/ {
              auth_basic "UZStock server monitoring";
              auth_basic_user_file /etc/nginx/.htpasswd-uzstock-monitor;

              proxy_redirect off;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-Server $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_pass_request_headers on;
              proxy_set_header Connection "keep-alive";
              proxy_store off;
              rewrite ^/monitor/(.*)$ /$1 break;
              proxy_pass http://127.0.0.1:19999;
              gzip on;
              gzip_proxied any;
              gzip_types *;
          }
          """, encoding="utf-8")
          PY
          nginx_site_backup="$(mktemp)"
          python3 - "$nginx_site_backup" <<'PY'
          import re
          import sys
          from pathlib import Path

          marker = "# UZStock Netdata monitoring\n    include /etc/nginx/snippets/uzstock-monitor.conf;"
          candidates = [Path("/etc/nginx/nginx.conf")] + sorted(Path("/etc/nginx/sites-enabled").glob("*")) + sorted(Path("/etc/nginx/conf.d").glob("*.conf"))
          matched = False
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              insert_at = []
              for match in re.finditer(r"\bserver\s*\{", text):
                  start = match.start()
                  depth = 0
                  end = None
                  for index in range(match.end() - 1, len(text)):
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                          if depth == 0:
                              end = index
                              break
                  if end is None:
                      continue
                  block = text[start:end + 1]
                  is_uzstock_host = bool(re.search(r"\bserver_name\b[^;]*\buzstock\.uz\b", block))
                  is_tls_default = bool(re.search(r"\blisten\s+(?:\[::\]:)?443\b[^;]*\bdefault_server\b", block))
                  if not (is_uzstock_host or is_tls_default):
                      continue
                  matched = True
                  if marker not in block:
                      insert_at.append(end)
              if not insert_at:
                  continue
              # One config file is the active site on this VPS.  Preserve it
              # before editing, then add the route to every matching TLS block
              # (there can be a separate IPv4/IPv6 block).
              Path(sys.argv[1]).write_text(text, encoding="utf-8")
              for end in reversed(insert_at):
                  text = text[:end] + "\n    " + marker + "\n" + text[end:]
              path.write_text(text, encoding="utf-8")
              print(path)
              raise SystemExit(0)
          if not matched:
              raise SystemExit("Could not find the HTTPS Nginx server block for uzstock.uz")
          Path(sys.argv[1]).write_text("", encoding="utf-8")
          PY
          if ! nginx -t; then
            if [ -s "$nginx_site_backup" ]; then
              nginx_site_path="$(python3 - <<'PY'
          from pathlib import Path
          marker = "# UZStock Netdata monitoring\n    include /etc/nginx/snippets/uzstock-monitor.conf;"
          for path in sorted(Path('/etc/nginx/sites-enabled').glob('*')) + sorted(Path('/etc/nginx/conf.d').glob('*.conf')):
              if path.is_file() and marker in path.read_text(encoding='utf-8'):
                  print(path)
                  break
          PY
          )"
              cp "$nginx_site_backup" "$nginx_site_path"
            fi
            nginx -t >&2 || true
            exit 1
          fi
          rm -f "$nginx_site_backup"
          systemctl reload nginx
          asset_probe_path="$(curl -ksS --resolve uzstock.uz:443:127.0.0.1 https://uzstock.uz/ | sed -n 's/.*src="\([^"?]*\/assets\/[^"?]*\.js\)".*/\1/p' | head -n 1)"
          if [ -n "$asset_probe_path" ]; then
            echo "Asset response probe (directly against this VPS):"
            curl -ksS --resolve uzstock.uz:443:127.0.0.1 \
              -H 'Accept-Encoding: gzip' -D - -o /dev/null \
              "https://uzstock.uz${asset_probe_path}" | \
              grep -Ei '^(HTTP/|content-(encoding|length):|vary:)' || true
          fi
          unauthenticated_monitor_status="$(curl -ksS --resolve uzstock.uz:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://uzstock.uz/monitor/)"
          if [ "$unauthenticated_monitor_status" != "401" ]; then
            echo "Expected /monitor/ to require authentication; got HTTP $unauthenticated_monitor_status." >&2
            exit 1
          fi
          /snap/bin/docker pull netdata/netdata:stable >/dev/null
          /snap/bin/docker rm -f uzstock-monitor >/dev/null 2>&1 || true
          /snap/bin/docker run -d \
            --name uzstock-monitor \
            --restart unless-stopped \
            --pid=host \
            -p 127.0.0.1:19999:19999 \
            -e DO_NOT_TRACK=1 \
            -v netdataconfig:/etc/netdata \
            -v netdatalib:/var/lib/netdata \
            -v netdatacache:/var/cache/netdata \
            -v /etc/passwd:/host/etc/passwd:ro \
            -v /etc/group:/host/etc/group:ro \
            -v /proc:/host/proc:ro \
            -v /sys:/host/sys:ro \
            -v /etc/os-release:/host/etc/os-release:ro \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            netdata/netdata:stable
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:19999/api/v1/info >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:19999/api/v1/info >/dev/null; then
            /snap/bin/docker logs --tail 100 uzstock-monitor >&2
            exit 1
          fi
          shred -u "$netdata_password_file"
          codex_auth_file=/root/uzstock/.codex-auth-b64
          if [ ! -s "$codex_auth_file" ]; then
            echo "Codex news credential was not uploaded." >&2
            exit 1
          fi
          # docker-entrypoint.sh accepts only this fixed CODEX_HOME, decodes
          # the one-time seed with mode 0600, then drops privileges to appuser.
          /snap/bin/docker run --rm --network none \
            -v uzstock_data:/app/data \
            -e CODEX_HOME=/app/data/codex-home \
            -e CODEX_AUTH_JSON_B64="$(tr -d '\r\n' < "$codex_auth_file")" \
            uzstock-web:latest codex login status >/dev/null
          shred -u "$codex_auth_file"
          python3 - <<'PY'
          from pathlib import Path

          def worker(name: str, description: str, command: str, *, timeout: str = "30min",
                     data_volume: bool = False, extra_env: tuple[str, ...] = (), resources: str = "", cpus: str = "0.50") -> str:
              volume = " -v uzstock_data:/app/data" if data_volume else ""
              env = "".join(f" -e {value}" for value in extra_env)
              return f"""[Unit]
          Description={description}
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          TimeoutStartSec={timeout}
          ExecStartPre=-/snap/bin/docker rm -f {name}
          # A collector can parse a large exchange response immediately after a
          # deploy. Keep half a CPU free for the public web container so an
          # initial collection cannot stall /health, heatmap or finance routes.
          ExecStart=/snap/bin/docker run --rm --cpus {cpus} {resources} --name {name} --network uzstock-internal --env-file /root/uzstock/app/.env -e FINANCIALS_PUSH_URL=http://uzstock-web:8000{volume}{env} uzstock-web:latest {command}
          """

          def timer(description: str, calendar: str) -> str:
              return f"""[Unit]
          Description={description}

          [Timer]
          OnCalendar={calendar}
          Persistent=true
          AccuracySec=1min

          [Install]
          WantedBy=timers.target
          """

          units = {
              # The schedules below preserve Railway's currently active UTC cron
              # expressions.  The system clock on this VPS is UTC.
              "/etc/systemd/system/uzstock-collector.service": worker(
                  "uzstock-collector", "UZStock full financial data collector",
                  "python collector_financials.py", timeout="90min",
                  data_volume=True, extra_env=("BANK_HISTORY_BATCH=0",)),
              "/etc/systemd/system/uzstock-collector.timer": timer(
                  "Run UZStock full data collector on weekdays", "Mon..Fri *-*-* 03:00:00"),
              # Historical documents AND their provenance must survive the
              # worker. The stateless market collector only pushes figures.
              "/etc/systemd/system/uzstock-bank-history.service": worker(
                  "uzstock-bank-history", "UZStock persistent bank history repair",
                  "python collector_financials.py --bank-history-only --bank-history-due-only --bank-history-limit 3",
                  timeout="90min", data_volume=True),
              "/etc/systemd/system/uzstock-bank-history.timer": timer(
                  "Repair bank financial history daily", "*-*-* 02:00:00"),
              "/etc/systemd/system/uzstock-financial-ingestion.service": worker(
                  "uzstock-financial-ingestion", "UZStock NSBU history and IFRS document staging",
                  "python -m financial_ingestion.bulk --workers 2 --ocr --nsbu-history --report /app/data/bulk-financial-report.json",
                  timeout="24h", cpus="1.0", data_volume=True,
                  resources="--memory 3g --memory-swap 3g --pids-limit 256",
                  extra_env=("APP_DATA_DIR=/app/data", "FINANCIAL_ARTIFACT_DIR=/app/data/financial_artifacts",
                             "OMP_THREAD_LIMIT=1", "OPENBLAS_NUM_THREADS=1"))
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-financial-ingestion\n",
              "/etc/systemd/system/uzstock-financial-ingestion.timer": timer(
                  "Collect financial history nightly at 02:00 Tashkent", "*-*-* 02:00:00 Asia/Tashkent"),
              "/etc/systemd/system/uzstock-financial-backup.service": worker(
                  "uzstock-financial-backup", "Verified financial database and original-document backup",
                  "python -m financial_ingestion.worker backup", data_volume=True,
                  resources="--memory 768m --memory-swap 768m")
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-financial-backup\n",
              "/etc/systemd/system/uzstock-financial-backup.timer": timer(
                  "Back up financial evidence daily", "*-*-* 01:00:00"),
              # Accounts, sessions and analytics live in PostgreSQL, which the
              # financial backup above does not cover. Runs on the host from the
              # deployed checkout; see scripts/backup_postgres.sh.
              "/etc/systemd/system/uzstock-postgres-backup.service": """[Unit]
          Description=Verified nightly PostgreSQL backup (accounts, sessions, analytics)
          After=snap.docker.dockerd.service

          [Service]
          Type=oneshot
          TimeoutStartSec=30min
          ExecStart=/bin/sh /root/uzstock/app/scripts/backup_postgres.sh
          """,
              "/etc/systemd/system/uzstock-postgres-backup.timer": timer(
                  "Back up PostgreSQL daily", "*-*-* 00:40:00"),
              "/etc/systemd/system/uzstock-financial-monitor.service": worker(
                  "uzstock-financial-monitor", "Financial pipeline incidents and freshness checks",
                  "python -m financial_ingestion.worker monitor", data_volume=True,
                  resources="--memory 256m --memory-swap 256m")
                  + "\nExecStopPost=-/snap/bin/docker stop -t 20 uzstock-financial-monitor\n",
              "/etc/systemd/system/uzstock-financial-monitor.timer": timer(
                  "Monitor financial evidence every fifteen minutes", "*-*-* *:10,25,40,55:00"),
              "/etc/systemd/system/uzstock-quotes-1610.service": worker(
                  "uzstock-quotes-1610", "UZStock post-close quotes collector",
                  "python collector_financials.py --trades-only"),
              "/etc/systemd/system/uzstock-quotes-1610.timer": timer(
                  "Run UZStock 16:10 local quotes collector", "Mon..Sat *-*-* 11:10:00"),
              "/etc/systemd/system/uzstock-quotes-2130.service": worker(
                  "uzstock-quotes-2130", "UZStock final-session quotes collector",
                  "python collector_financials.py --trades-only"),
              "/etc/systemd/system/uzstock-quotes-2130.timer": timer(
                  "Run UZStock 21:30 local quotes collector", "Mon..Sat *-*-* 16:30:00"),
              "/etc/systemd/system/uzstock-reports-watch.service": worker(
                  "uzstock-reports-watch", "UZStock newly filed reports watcher",
                  "python collector_financials.py --watch-filings"),
              "/etc/systemd/system/uzstock-reports-watch.timer": timer(
                  "Run UZStock reports watcher", "Mon..Sat *-*-* 18:00:00"),
              "/etc/systemd/system/uzstock-bank-fx.service": worker(
                  "uzstock-bank-fx", "UZStock commercial bank FX collector",
                  "python collector_financials.py --bank-fx-only"),
              "/etc/systemd/system/uzstock-bank-fx.timer": timer(
                  "Run UZStock bank FX collector", "*-*-* 06:10:00"),
              "/etc/systemd/system/uzstock-news-collector.service": worker(
                  "uzstock-news-collector", "UZStock Codex news collector",
                  "python news_collector.py", timeout="60min", data_volume=True,
                  extra_env=(
                      "CODEX_HOME=/app/data/codex-home",
                      "CODEX_EXECUTABLE=codex",
                      "NEWS_CLASSIFIER_PROVIDER=codex",
                      "NEWS_CODEX_MODEL=gpt-5.6-luna",
                      "NEWS_CODEX_FALLBACK_MODEL=gpt-5.6-terra",
                      "NEWS_CODEX_REASONING=low",
                      "NEWS_CODEX_TIMEOUT=180",
                      "NEWS_OG_MAX_FETCH=40",
                      "NEWS_PUSH_URL=https://uzstock.uz",
                      "TZ=Asia/Tashkent",
                  )),
              "/etc/systemd/system/uzstock-news-collector.timer": timer(
                  "Run UZStock Codex news collector", "*-*-* 11:10:00"),
          }
          for name, content in units.items():
              Path(name).write_text(content, encoding="utf-8")
          PY
          # Retired 2026-09-25: an hourly, round-the-clock walk of the uzse.uz
          # trade feed (plus one more after every deploy) and a mid-session
          # 13:00 run added up to ~30 full crawls a day, and uzse.uz blocked
          # this host's IP. Hourly bars come from each execution's own
          # timestamp, so the 16:10 and 21:30 runs still build every hour of
          # the session; nothing is lost but mid-session freshness.
          for retired in uzstock-intraday uzstock-quotes-1300; do
            systemctl disable --now "$retired.timer" >/dev/null 2>&1 || true
            systemctl stop "$retired.service" >/dev/null 2>&1 || true
            docker rm -f "$retired" >/dev/null 2>&1 || true
            rm -f "/etc/systemd/system/$retired.timer" "/etc/systemd/system/$retired.service"
          done
          systemctl daemon-reload
          for timer in \
            uzstock-financial-backup.timer uzstock-postgres-backup.timer uzstock-financial-monitor.timer \
            uzstock-collector.timer uzstock-quotes-1610.timer \
            uzstock-quotes-2130.timer uzstock-reports-watch.timer \
            uzstock-bank-fx.timer uzstock-bank-history.timer uzstock-financial-ingestion.timer uzstock-news-collector.timer; do
            systemctl enable --now "$timer"
            systemctl is-active --quiet "$timer"
          done
          REMOTE

  publish-reviewed-bank-ifrs:
    name: Publish and verify reviewed bank IFRS
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/API' && contains(github.event.head_commit.message, '[publish-bank-ifrs]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publish exact reviewed sources and verify passports
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          EXPECTED_SHA: ${{ github.sha }}
          ALLOW_REVIEWED_CORRECTIONS: ${{ contains(github.event.head_commit.message, '[correct-bank-ifrs]') }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "bash -s -- '$EXPECTED_SHA' '$ALLOW_REVIEWED_CORRECTIONS'" <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          test "$(git rev-parse HEAD)" = "$1"
          test "$(docker inspect --format '{{.Image}}' uzstock-web)" = "$(docker image inspect --format '{{.Id}}' uzstock-web:latest)"
          timer_active=$(systemctl is-active uzstock-financial-ingestion.timer || true)
          restore_timer() {
            if [ "$timer_active" = active ]; then systemctl start uzstock-financial-ingestion.timer; fi
          }
          trap restore_timer EXIT
          systemctl stop uzstock-financial-ingestion.timer uzstock-financial-ingestion.service
          release_args=(--apply)
          if [ "$2" = true ]; then release_args+=(--allow-reviewed-corrections); fi
          docker exec uzstock-web python -m scripts.publish_reviewed_bank_ifrs "${release_args[@]}"
          docker exec uzstock-web python -m financial_ingestion.worker monitor
          REMOTE

  test-news-collector:
    name: Test production news collector
    needs: deploy-production
    # This is deliberately opt-in. Normal deployments leave the scheduled
    # collector alone; a manual run captures its Codex limit before/after.
    if: github.event_name == 'workflow_dispatch' && (inputs.run_news_now || inputs.report_news_usage)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run and report production Codex news collection
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          RUN_NEWS_NOW: ${{ inputs.run_news_now }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=150 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "RUN_NEWS_NOW='$RUN_NEWS_NOW' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$RUN_NEWS_NOW" = "true" ]; then
            # `systemctl start` waits for this Type=oneshot service, so the log
            # below belongs to this manual invocation rather than a timer run.
            started_at="$(date --iso-8601=seconds)"
            print_log() {
              journalctl -u uzstock-news-collector.service --since "$started_at" \
                --no-pager -o cat || true
            }
            trap print_log EXIT
            systemctl start uzstock-news-collector.service
            result="$(systemctl show --property=Result --value uzstock-news-collector.service)"
            if [ "$result" != "success" ]; then
              echo "News collector systemd result: $result" >&2
              exit 1
            fi
          fi
          docker exec -i uzstock-web python - <<'PY'
          import json
          from reports_catalog import get_catalog_conn

          fields = (
              "finished_at", "status", "model", "calls", "total_tokens",
              "subscription_tokens", "codex_before_pct", "codex_after_pct",
              "codex_delta_pct", "codex_resets_at", "fetched", "classified",
              "relevant", "pushed",
          )
          conn = get_catalog_conn()
          try:
              row = conn.execute(
                  f"SELECT {', '.join(fields)} FROM news_usage_runs ORDER BY finished_at DESC LIMIT 1"
              ).fetchone()
          finally:
              conn.close()
          if row is None:
              raise SystemExit("No persisted news usage record was found")
          print("NEWS_USAGE_REPORT=" + json.dumps(dict(row), ensure_ascii=False, sort_keys=True))
          PY
          REMOTE

  backfill-company-financials:
    name: Backfill one company's financial history
    needs: deploy-production
    # Opt-in because this downloads and parses the issuer's published workbooks.
    # A single ticker makes a visible company-page repair without creating a
    # full-market collection job during an ordinary deployment.
    if: github.event_name == 'workflow_dispatch' && (inputs.backfill_financial_ticker != '' || inputs.backfill_quarter_history_ticker != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Parse and publish issuer history
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          BACKFILL_TICKER: ${{ inputs.backfill_financial_ticker }}
          BACKFILL_QUARTER_HISTORY_TICKER: ${{ inputs.backfill_quarter_history_ticker }}
        run: |
          if [ -n "$BACKFILL_TICKER" ] && [ -n "$BACKFILL_QUARTER_HISTORY_TICKER" ]; then
            echo "Choose either annual or quarterly history backfill, not both." >&2
            exit 2
          fi
          target="${BACKFILL_TICKER:-$BACKFILL_QUARTER_HISTORY_TICKER}"
          case "$target" in
            ""|*[!A-Za-z0-9]*) echo "Ticker must contain letters and numbers only." >&2; exit 2 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "BACKFILL_TICKER=$target BACKFILL_QUARTER_HISTORY_TICKER=$BACKFILL_QUARTER_HISTORY_TICKER bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -n "$BACKFILL_QUARTER_HISTORY_TICKER" ]; then
            docker exec -i -e FINANCIALS_PUSH_URL=http://uzstock-web:8000 uzstock-web \
              python collector_financials.py --backfill-company-quarter-history "$BACKFILL_TICKER"
          else
            docker exec -i -e FINANCIALS_PUSH_URL=http://uzstock-web:8000 uzstock-web \
              python collector_financials.py --backfill-company-financials "$BACKFILL_TICKER"
          fi
          docker exec -i uzstock-web python - "$BACKFILL_TICKER" <<'PY'
          import json
          import sys
          from reports_catalog import get_company_reports, get_financials_series, get_financials_series_quarterly

          ticker = sys.argv[1]
          series = get_financials_series(ticker)
          quarterly = get_financials_series_quarterly(ticker)
          reports = get_company_reports(ticker)
          print("FINANCIAL_HISTORY_BACKFILL=" + json.dumps({
              "ticker": ticker,
              "periods": sorted(series, reverse=True),
              "quarterly_periods": sorted(quarterly, reverse=True),
              "quarterly_reports": sorted(
                  [f"{r['year']}Q{r['quarter']}" for r in reports
                   if r.get("report_form") == "NSBU" and r.get("period_type") == "quarter"
                   and r.get("year") and r.get("quarter")],
                  reverse=True,
              ),
          }, ensure_ascii=False))
          PY
          REMOTE

  compact-admin-control:
    name: Compact retained admin-control history
    needs: deploy-production
    # Explicit one-shot maintenance marker. Ordinary API deployments can never
    # stop the web service or alter revision history.
    if: github.event_name == 'push' && github.ref == 'refs/heads/API' && contains(github.event.head_commit.message, '[compact-admin-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Retain only bounded revisions and restore web
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          db_path=/app/data/admin_control.sqlite3
          docker inspect uzstock-web >/dev/null
          docker volume inspect uzstock_data >/dev/null
          image=$(docker inspect --format '{{.Config.Image}}' uzstock-web)
          was_running=$(docker inspect --format '{{.State.Running}}' uzstock-web)
          restore_web() {
            if [ "$was_running" = true ] && [ "$(docker inspect --format '{{.State.Running}}' uzstock-web)" != true ]; then
              docker start uzstock-web >/dev/null || true
            fi
          }
          trap restore_web EXIT
          docker builder prune --all --force
          docker image prune --all --force
          free_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          [ "${free_kb:-0}" -ge 2097152 ] || { echo 'Less than 2 GiB remains after safe cleanup.' >&2; exit 1; }
          if [ "$was_running" = true ]; then docker stop -t 30 uzstock-web >/dev/null; fi
          docker run --rm --network none --entrypoint python -v uzstock_data:/app/data "$image" \
            /app/scripts/compact_admin_control.py --database "$db_path" --keep 10 --days 90 --discard-stale-target --confirm
          restore_web
          trap - EXIT
          for attempt in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Running}}' uzstock-web)" = true ] && break
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Running}}' uzstock-web)" = true
          docker exec -i uzstock-web python - <<'PY'
          import os, sqlite3
          import psycopg
          path = os.environ.get("ADMIN_CONTROL_DB", "/app/data/admin_control.sqlite3")
          conn = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          try:
              assert conn.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              pages, size = conn.execute("PRAGMA page_count").fetchone()[0], conn.execute("PRAGMA page_size").fetchone()[0]
              print(f"ADMIN_DB_BYTES={pages * size} revisions={conn.execute('SELECT COUNT(*) FROM control_revisions').fetchone()[0]}")
          finally:
              conn.close()
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=10) as pg:
              with pg.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM web_users")
                  print(f"AUTH_DB_STATUS=ok user_count={cur.fetchone()[0]}")
          PY
          REMOTE
