          docker exec uzstock-web python -m catalogue.balance_repair --rollback-unverified --apply
          docker exec uzstock-web python -m catalogue.balance_repair
          docker exec uzstock-web python -m catalogue.balance_repair --apply
          docker restart uzstock-web
          REMOTE

