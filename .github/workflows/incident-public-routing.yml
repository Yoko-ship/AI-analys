name: Temporary public routing investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/API'
    environment: uzstock-production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect production routing without changing services
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/uzstock/app
          python3 - <<'PY'
          import concurrent.futures, importlib.util, json, re, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("ci_log", "scripts/ci_log.py")
          log = importlib.util.module_from_spec(spec); spec.loader.exec_module(log)
          def run(name, args, timeout=25):
              try:
                  p = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
                  text = p.stdout + p.stderr
              except Exception as e:
                  text = type(e).__name__
              print("\nCHECK " + name, flush=True)
              print(log.redact(text[-20000:]), flush=True)
              return text
          run("time", ["date", "-Is"])
          run("load", ["uptime"])
          run("memory", ["free", "-m"])
          run("disk", ["df", "-h", "/"])
          run("checkout", ["git", "rev-parse", "HEAD"])
          run("containers", ["docker", "ps", "--format", "{{.Names}} {{.Status}} {{.Ports}}"])
          run("image revision", ["docker", "inspect", "--format", '{{index .Config.Labels "org.opencontainers.image.revision"}}', "uzstock-web"])
          run("services", ["systemctl", "is-active", "nginx", "openresty", "docker", "snap.docker.dockerd", "ufw", "fail2ban"])
          run("interfaces", ["ip", "-br", "address"])
          run("routes", ["ip", "route"])
          run("listeners", ["ss", "-ltnp", "( sport = :80 or sport = :443 or sport = :8001 )"])
          run("nginx syntax", ["nginx", "-t"])
          p = subprocess.run(["nginx", "-T"], capture_output=True, text=True, timeout=15)
          print("\nCHECK selected nginx routing directives", flush=True)
          for line in p.stdout.splitlines():
              if re.match(r"\s*(# configuration file|listen |server_name |proxy_pass |upstream |location |return |allow |deny |proxy_set_header (Host|X-Forwarded-Proto)|access_log |error_log )", line):
                  print(log.redact(line), flush=True)
          run("firewall", ["ufw", "status", "verbose"])
          run("input counters", ["iptables", "-nvL", "INPUT", "--line-numbers"])
          run("nft rules", ["nft", "list", "ruleset"])
          run("fail2ban", ["fail2ban-client", "status"])
          run("nginx errors", ["journalctl", "-u", "nginx", "--since", "today", "-n", "40", "--no-pager"])
          for p in Path("/var/log/nginx").glob("*error.log"):
              run("error log " + p.name, ["tail", "-n", "30", str(p)])
          commands = [
          ("api health", ["curl", "-sS", "--max-time", "12", "-o", "/dev/null", "-w", "HTTP=%{http_code} time=%{time_total}\n", "http://127.0.0.1:8001/health"]),
          ("origin http", ["curl", "-sS", "--max-time", "12", "-H", "Host: uzstock.uz", "-o", "/dev/null", "-w", "HTTP=%{http_code} time=%{time_total}\n", "http://127.0.0.1/health"]),
          ("origin https", ["curl", "-ksS", "--max-time", "12", "--resolve", "uzstock.uz:443:127.0.0.1", "-o", "/dev/null", "-w", "HTTP=%{http_code} time=%{time_total}\n", "https://uzstock.uz/health"]),
          ("public https", ["curl", "-sS", "--max-time", "15", "-o", "/dev/null", "-w", "HTTP=%{http_code} time=%{time_total}\n", "https://uzstock.uz/health"]),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(lambda pair: run(*pair), commands))
          print("\nCHECK nginx recent status summary", flush=True)
          from collections import Counter
          for p in Path("/var/log/nginx").glob("*access.log"):
              result = subprocess.run(["tail", "-n", "1000", str(p)], capture_output=True, text=True, timeout=10)
              counts = Counter()
              for line in result.stdout.splitlines():
                  m = re.match(r'(\S+).*?\[([^]]+)\] "(\S+) ([^ ?]+)[^"]*" (\d+)', line)
                  if m:
                      peer, stamp, method, path, status = m.groups()
                      counts[(peer, status)] += 1
              print(log.redact(json.dumps({"file": str(p), "peer_status_counts": [(peer,status,count) for (peer,status),count in counts.most_common(20)]})), flush=True)
          PY
          REMOTE
