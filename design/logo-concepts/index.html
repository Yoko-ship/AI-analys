<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UZStock logo concepts</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #061427; color: #f7fbff; }
      body { margin: 0; padding: 48px 24px; } main { max-width: 900px; margin: auto; }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.25rem); } p { color: #b9c7d9; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin-top: 32px; }
      article { border: 1px solid #254365; border-radius: 20px; background: #0b2039; padding: 20px; } article.selected { border-color: #65e6a2; box-shadow: 0 0 0 1px #65e6a2; }
      img { width: 100%; aspect-ratio: 1; display: block; } h2 { font-size: 1rem; margin: 16px 0 0; } small { color: #7af0b1; }
    </style>
  </head>
  <body><main>
    <h1>UZStock identity directions</h1>
    <p>Six SVG concepts for a trusted Uzbekistan market-data product. Concept 01 is the selected live mark: a U-shaped market curve turning into an upward arrow.</p>
    <section class="grid">
      <article class="selected"><img src="01-market-arc.svg" alt="Market arc"/><h2>01 · Market arc</h2><small>Selected</small></article>
      <article><img src="02-market-orbit.svg" alt="Market orbit"/><h2>02 · Market orbit</h2></article>
      <article><img src="03-candle-grid.svg" alt="Candle grid"/><h2>03 · Candle grid</h2></article>
      <article><img src="04-uz-lattice.svg" alt="UZ lattice"/><h2>04 · UZ lattice</h2></article>
      <article><img src="05-price-window.svg" alt="Price window"/><h2>05 · Price window</h2></article>
      <article><img src="06-data-sun.svg" alt="Data sun"/><h2>06 · Data sun</h2></article>
    </section>
  </main></body>
</html>
