<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='5' y='5' width='90' height='90' rx='24' fill='%23062D5F'/%3E%3Cpath d='M28 28v24c0 13.2 8 21 19 21 8.5 0 14.5-4.5 17-12.2' fill='none' stroke='%23F7FBFF' stroke-linecap='round' stroke-width='9'/%3E%3Cpath d='M54 61.5 76 32' fill='none' stroke='%2365E6A2' stroke-linecap='round' stroke-width='9'/%3E%3Cpath d='m64.5 32 11.5 0 0 11.5' fill='none' stroke='%2365E6A2' stroke-linecap='round' stroke-linejoin='round' stroke-width='8'/%3E%3C/svg%3E" />
    <title>UZStock — фондовый рынок Узбекистана</title>
    <meta name="theme-color" content="#f5f7fa" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("uz_stock_analyzer_theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.body.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0e0f12" : "#f5f7fa");
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
 </html>
